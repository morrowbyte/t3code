name: Weasel desktop nightly
run-name: Weasel desktop release ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built prerelease (false keeps artifacts only)
        type: boolean
        default: true
      source_sha:
        description: Exact source commit (fork main for publishing, dispatched branch for artifacts only)
        required: true
        type: string
      recover_desktop_run_id:
        description: One-off .48 recovery only (39093205395); reuse desktop bytes and build only Android
        type: string
        default: ""

concurrency:
  group: weasel-desktop-nightly
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    if: github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code')
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.recovery.outputs.source_sha || steps.release.outputs.source_sha }}
      version: ${{ steps.recovery.outputs.version || steps.release.outputs.version }}
      android_version_code: ${{ steps.recovery.outputs.android_version_code || steps.release.outputs.android_version_code }}
      tag: ${{ steps.recovery.outputs.tag || steps.release.outputs.tag }}
      observatory_route_sha256: ${{ steps.recovery.outputs.observatory_route_sha256 || steps.route.outputs.observatory_route_sha256 }}
      desktop_run_id: ${{ steps.recovery.outputs.desktop_run_id || github.run_id }}
      desktop_run_attempt: ${{ steps.recovery.outputs.desktop_run_attempt || github.run_attempt }}
      desktop_context_sha: ${{ steps.recovery.outputs.desktop_context_sha || github.sha }}
      desktop_workflow_sha: ${{ steps.recovery.outputs.desktop_workflow_sha || github.workflow_sha }}
      desktop_workflow_ref: ${{ steps.recovery.outputs.desktop_workflow_ref || github.workflow_ref }}
      recovery_artifact_attempt: ${{ steps.recovery.outputs.recovery_artifact_attempt }}
      recovery_receipt_sha256: ${{ steps.recovery.outputs.recovery_receipt_sha256 }}
      recovery_workflow_sha256: ${{ steps.recovery.outputs.recovery_workflow_sha256 }}
    steps:
      - name: Checkout promoted source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - id: recovery
        name: Recover only the pinned .48 desktop bytes and original proofs
        if: inputs.recover_desktop_run_id != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recover_desktop_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYRECOVERY'
          import hashlib, json, os, pathlib, shutil, stat, subprocess, zipfile
          source = 'ce275176a119b1a2c599c23e6acd7d537cc4c336'
          origin_run = '39093205395'
          workflow = '.github/workflows/weasel-release.yml'
          workflow_ref = 'morrowbyte/t3code/' + workflow + '@refs/heads/main'
          expected_route = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          repo = os.environ['GITHUB_REPOSITORY']
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          api = lambda suffix: json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/' + suffix]))
          assert repo == 'morrowbyte/t3code'
          assert os.environ['RECOVERY_RUN_ID'] == origin_run and os.environ['SOURCE_SHA'] == source
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_WORKFLOW_REF'] == workflow_ref
          assert os.environ['GITHUB_WORKFLOW_SHA'] == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD') == source
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', 'main'], check=True)
          control = git('rev-parse', 'FETCH_HEAD')
          assert control == os.environ['GITHUB_SHA'], 'Recovery control must still be current main.'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, control], check=True)
          assert git('diff', '--name-only', source, control).splitlines() == [workflow], 'Recovery may change only this workflow, never product source/locks.'
          origin_workflow = subprocess.check_output(['git', 'show', source + ':' + workflow])
          assert hashlib.sha256(origin_workflow).hexdigest() == 'e32a45bed015294f69c01fb44309468f389e2093f3c3e323cfdb314492c843ef'
          control_workflow_sha256 = hashlib.sha256(subprocess.check_output(['git', 'show', control + ':' + workflow])).hexdigest()
          run = api(f'actions/runs/{origin_run}')
          assert run['id'] == int(origin_run) and run['run_number'] == 48 and run['run_attempt'] == 1
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == repo
          assert run['head_sha'] == source and run['head_branch'] == 'main'
          assert run['event'] == 'workflow_dispatch' and run['path'] == workflow
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          expected_jobs = {'preflight': 'success', 'build_bundle': 'success', 'build_linux': 'success', 'build_nixos': 'success', 'build_windows': 'success', 'Build Morrowbyte Android APK': 'failure', 'publish': 'skipped'}
          jobs = api(f'actions/runs/{origin_run}/attempts/1/jobs?per_page=100')
          assert jobs['total_count'] == len(expected_jobs)
          assert {j['name']: j['conclusion'] for j in jobs['jobs']} == expected_jobs
          assert all(j['head_sha'] == source and j['status'] == 'completed' for j in jobs['jobs'])
          android = next(j for j in jobs['jobs'] if j['name'] == 'Build Morrowbyte Android APK')
          assert [s['name'] for s in android['steps'] if s['conclusion'] == 'failure'] == ['Bind source and verify standalone fork configuration']
          pins = {
              "12124275441": [
                  "weasel-release-cli-windows",
                  "sha256:8bf29216a2b8a93b5cf4270bdd31e8e19213b95f0306d221f02e6bbb9b28840d"
              ],
              "12123931607": [
                  "weasel-release-windows",
                  "sha256:9ab9b193bb513c27d24cec85aabf48bd843d3e3bd9fcdc91c10d073e3c1fd8c3"
              ],
              "12123712026": [
                  "weasel-release-linux",
                  "sha256:86c2bcc648416611330e0bb1d3d625cc456fc1b512bf4d53d661a0763bbed686"
              ],
              "12123662231": [
                  "weasel-release-cli-linux",
                  "sha256:abcc203b8420e3f50d17bdf0a14047b677c28fd53380df3253e83e809c41f363"
              ],
              "12123547205": [
                  "weasel-observatory-preflight-ce275176a119b1a2c599c23e6acd7d537cc4c336-1",
                  "sha256:7ba5df1996ca0092df64256e05fb4484994cced72e7067d322be69f25336415d"
              ],
              "12123542753": [
                  "weasel-release-nixos",
                  "sha256:1ba38e4340acc30081b803aee1664ae2ba2753fcf2c0a20c7d747fa8349bba00"
              ],
              "12123229340": [
                  "weasel-observatory-build-ce275176a119b1a2c599c23e6acd7d537cc4c336-1",
                  "sha256:9dae9b78dcfc61c6895be13b95f2f5a74ee3166ebea6c69519aab375bad4b37b"
              ]
          }
          metadata = api(f'actions/runs/{origin_run}/artifacts?per_page=100')
          assert metadata['total_count'] == len(metadata['artifacts'])
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assets = root / 'recovered-desktop'
          assets.mkdir()
          archives = root / 'desktop-origin-archives'
          archives.mkdir()
          records = []
          for artifact_id, (name, expected_digest) in pins.items():
              found = [a for a in metadata['artifacts'] if str(a['id']) == artifact_id]
              assert len(found) == 1
              artifact = found[0]
              assert artifact['name'] == name and artifact['digest'] == expected_digest and not artifact['expired']
              assert artifact['workflow_run']['id'] == int(origin_run) and artifact['workflow_run']['head_sha'] == source
              assert artifact['workflow_run']['repository_id'] == artifact['workflow_run']['head_repository_id'] == run['repository']['id']
              archive_path = archives / (artifact_id + '.zip')
              with archive_path.open('wb') as output:
                  subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact_id}/zip'], stdout=output, check=True)
              assert archive_path.stat().st_size == artifact['size_in_bytes']
              assert 'sha256:' + digest(archive_path) == expected_digest, 'Origin artifact ZIP digest mismatch.'
              target = assets
              if name.startswith('weasel-observatory-preflight-'):
                  target = root / 'observatory-route-generation'
              elif name.startswith('weasel-observatory-build-'):
                  target = root / 'observatory-release-build'
              target.mkdir(exist_ok=True)
              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      assert member.filename == pathlib.PurePosixPath(member.filename).name and not member.is_dir()
                      assert not stat.S_ISLNK(member.external_attr >> 16)
                      destination = target / member.filename
                      assert not destination.exists(), 'Duplicate artifact member.'
                      with archive.open(member) as incoming, destination.open('wb') as outgoing:
                          shutil.copyfileobj(incoming, outgoing)
              records.append({key: artifact[key] for key in ['id', 'name', 'digest', 'size_in_bytes', 'expires_at']})
              archive_path.unlink()
          preflight = root / 'observatory-route-generation'
          build = root / 'observatory-release-build'
          pre = json.loads((preflight / 'receipt.json').read_bytes())
          built = json.loads((build / 'receipt.json').read_bytes())
          for receipt in [pre, built]:
              assert receipt['source'] == receipt['trustedContextSha'] == receipt['trustedWorkflowSha'] == source
              assert receipt['run'] == origin_run and receipt['attempt'] == '1'
              assert receipt['trustedWorkflowRef'] == workflow_ref
              assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
          assert pre['status'] == 'generated-unreviewed' and pre['effectiveSourceSha'] == source
          assert pre['checkScriptSha256'] == digest(pathlib.Path('scripts/weasel/check.sh'))
          assert pre['beforeSha256'] == hashlib.sha256(subprocess.check_output(['git', 'show', source + ':apps/web/src/routeTree.gen.ts'])).hexdigest()
          assert pre['generatorVersion'] == '1.167.12' and pre['config'] == {'autoCodeSplitting': True}
          assert pre['afterSha256'] == built['generatedRouteSha256'] == expected_route
          assert digest(preflight / 'routeTree.gen.ts') == digest(build / 'routeTree.gen.ts') == expected_route
          assert built['preflightReceiptSha256'] == digest(preflight / 'receipt.json')
          assert (preflight / 'routeTree.diff').is_file()
          receipt = {'schemaVersion': 1, 'source': source, 'version': '0.1.2-nightly.20261018.48', 'originRun': origin_run, 'originAttempt': '1',
                     'originWorkflowSha': source, 'originWorkflowRef': workflow_ref, 'originWorkflowSha256': hashlib.sha256(origin_workflow).hexdigest(),
                     'promotionRun': os.environ['GITHUB_RUN_ID'], 'promotionAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'promotionContextSha': control, 'promotionWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
                     'promotionWorkflowRef': os.environ['GITHUB_WORKFLOW_REF'], 'promotionWorkflowSha256': control_workflow_sha256,
                     'changedPaths': [workflow], 'originArtifacts': records,
                     'files': [{'name': p.name, 'sha256': digest(p)} for p in sorted(assets.iterdir())]}
          receipt_path = assets / 'DESKTOP-RECOVERY.json'
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'source_sha': source, 'version': receipt['version'], 'android_version_code': '48', 'tag': 'v' + receipt['version'],
                                 'observatory_route_sha256': expected_route, 'desktop_run_id': origin_run, 'desktop_run_attempt': '1',
                                 'desktop_context_sha': source, 'desktop_workflow_sha': source, 'desktop_workflow_ref': workflow_ref,
                                 'recovery_artifact_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                                 'recovery_receipt_sha256': digest(receipt_path), 'recovery_workflow_sha256': control_workflow_sha256}.items():
                  output.write(f'{key}={value}\n')
          PYRECOVERY

      - name: Preserve recovered desktop bytes without rebuilding
        if: inputs.recover_desktop_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-recovered-desktop
          path: ${{ runner.temp }}/recovered-desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve original Observatory build proof without rewriting it
        if: inputs.recover_desktop_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: weasel-observatory-build-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-release-build/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify published or artifact-only source
        if: inputs.recover_desktop_run_id == ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          DISPATCHED_REF: ${{ github.ref }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          bash scripts/weasel/verify-desktop-source.sh "$SOURCE_SHA" "$PUBLISH_RELEASE" "$DISPATCHED_REF" "$DISPATCHED_SHA"

      - name: Setup Vite+
        if: inputs.recover_desktop_run_id == ''
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        if: inputs.recover_desktop_run_id == ''
        run: vp install --frozen-lockfile
      - name: Prepare pinned Electron runtime before desktop imports
        if: inputs.recover_desktop_run_id == ''
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs

      - name: Check source before release
        if: inputs.recover_desktop_run_id == ''
        env:
          EFFECTIVE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EFFECTIVE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EFFECTIVE_SOURCE_SHA"
          bash scripts/weasel/check.sh

      - id: route
        name: Verify reviewed Observatory preflight route
        if: inputs.recover_desktop_run_id == ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observatory-route-generation'
          receipt = json.loads((root / 'receipt.json').read_bytes())
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert receipt['status'] == 'generated-unreviewed'
          assert receipt['source'] == receipt['effectiveSourceSha'] == source
          assert receipt['run'] == os.environ['GITHUB_RUN_ID'] and receipt['attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert receipt['trustedContextSha'] == os.environ['GITHUB_SHA']
          assert receipt['trustedWorkflowSha'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert receipt['trustedWorkflowRef'] == os.environ['GITHUB_WORKFLOW_REF']
          assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
          assert receipt['checkScriptSha256'] == digest(pathlib.Path('scripts/weasel/check.sh'))
          before = subprocess.check_output(['git', 'show', source + ':apps/web/src/routeTree.gen.ts'])
          assert receipt['beforeSha256'] == hashlib.sha256(before).hexdigest()
          assert receipt['generatorVersion'] == '1.167.12' and receipt['config'] == {'autoCodeSplitting': True}
          assert receipt['afterSha256'] == digest(root / 'routeTree.gen.ts') == expected
          assert digest(pathlib.Path('apps/web/src/routeTree.gen.ts')) == expected
          assert (root / 'routeTree.diff').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('observatory_route_sha256=' + expected + '\n')
          PYROUTE

      - name: Preserve release Observatory preflight route evidence
        if: always() && hashFiles('apps/web/src/routes/observatory.tsx') != '' && (inputs.recover_desktop_run_id == '' || steps.recovery.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: weasel-observatory-preflight-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observatory-route-generation/receipt.json
            ${{ runner.temp }}/observatory-route-generation/routeTree.gen.ts
            ${{ runner.temp }}/observatory-route-generation/routeTree.diff
          if-no-files-found: error
          retention-days: 7

      - id: release
        name: Resolve distinct fork version
        if: inputs.recover_desktop_run_id == ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ ]]
          (( RELEASE_RUN <= 2100000000 ))
          upstream_metadata="$RUNNER_TEMP/upstream-nightly.txt"
          run_created_at="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          release_date="$(bash scripts/weasel/resolve-run-date.sh "$run_created_at")"
          node scripts/resolve-nightly-release.ts \
            --date "$release_date" \
            --run-number "$RELEASE_RUN" \
            --sha "$SOURCE_SHA" > "$upstream_metadata"
          source_nightly_base="$(sed -n 's/^base_version=//p' "$upstream_metadata")"
          fork_version="$(bash scripts/weasel/resolve-version.sh \
            "$source_nightly_base" \
            "$release_date" \
            "$RELEASE_RUN" | sed -n 's/^version=//p')"
          if [[ -z "$fork_version" ]]; then
            echo "Could not resolve a fork release version." >&2
            exit 1
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "version=$fork_version"
            echo "android_version_code=$RELEASE_RUN"
            echo "tag=v$fork_version"
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    if: inputs.recover_desktop_run_id == ''
    needs: [preflight]
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions and build shared assets
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          vp run build:desktop

      - name: Download reviewed preflight route evidence
        if: needs.preflight.outputs.observatory_route_sha256 != ''
        uses: actions/download-artifact@v4
        with:
          name: weasel-observatory-preflight-${{ needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-release-preflight

      - name: Bind independently built Observatory route
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PREFLIGHT_ROUTE_SHA: ${{ needs.preflight.outputs.observatory_route_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            test -z "$PREFLIGHT_ROUTE_SHA"
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert os.environ['PREFLIGHT_ROUTE_SHA'] == expected
          preflight = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observatory-release-preflight'
          before = json.loads((preflight / 'receipt.json').read_bytes())
          assert before['source'] == before['effectiveSourceSha'] == source
          assert before['run'] == os.environ['GITHUB_RUN_ID'] and before['attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert before['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
          assert before['afterSha256'] == digest(preflight / 'routeTree.gen.ts') == expected
          actual = pathlib.Path('apps/web/src/routeTree.gen.ts')
          assert digest(actual) == expected
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observatory-release-build'
          output.mkdir(mode=0o700)
          (output / 'routeTree.gen.ts').write_bytes(actual.read_bytes())
          receipt = {'source': source, 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'lockSha256': before['lockSha256'], 'generatedRouteSha256': expected,
                     'preflightReceiptSha256': digest(preflight / 'receipt.json'),
                     'trustedContextSha': os.environ['GITHUB_SHA'], 'trustedWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
                     'trustedWorkflowRef': os.environ['GITHUB_WORKFLOW_REF']}
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYROUTE

      - name: Preserve independently built Observatory route evidence
        if: always() && hashFiles('apps/web/src/routes/observatory.tsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: weasel-observatory-build-${{ needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observatory-release-build/receipt.json
            ${{ runner.temp }}/observatory-release-build/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 7

      - name: Upload shared assets
        uses: actions/upload-artifact@v4
        with:
          name: weasel-js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  build_linux:
    if: inputs.recover_desktop_run_id == ''
    needs: [preflight, build_bundle]
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Download shared assets
        uses: actions/download-artifact@v4
        with:
          name: weasel-js-bundle
          path: apps

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build Linux CLI executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build Linux AppImage and updater metadata
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code' }}
          T3CODE_DESKTOP_APP_ID: com.evilweasel.t3code
          T3CODE_DESKTOP_PRODUCT_NAME: T3 Code (Weasel Nightly)
          T3CODE_DESKTOP_PROFILE: weasel
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "false"
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: "false"
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 --build-version "${{ needs.preflight.outputs.version }}" --skip-build --keep-stage --output-dir release-linux
          test -s release-linux/nightly-linux.yml
          shopt -s nullglob
          stage_roots=(/tmp/t3code-desktop-linux-stage-* "$RUNNER_TEMP"/t3code-desktop-linux-stage-*)
          test "${#stage_roots[@]}" -gt 0
          update_config="$(find "${stage_roots[@]}" -path '*/resources/app-update.yml' -print -quit)"
          test -n "$update_config"
          IFS=/ read -r expected_owner expected_repo <<<"${T3CODE_DESKTOP_UPDATE_REPOSITORY}"
          grep -Fq "owner: $expected_owner" "$update_config"
          grep -Fq "repo: $expected_repo" "$update_config"

      - name: Prepare NixOS download bundle
        run: |
          set -euo pipefail
          sed "s|EvilWeasel/t3code|${{ vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code' }}|g" \
            scripts/weasel/install-linux.sh > release-linux/install-linux.sh
          appimage="$(find release-linux -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test "$(basename "$appimage")" = "T3-Code-${{ needs.preflight.outputs.version }}-x86_64.AppImage"
          tar -czf release-linux/weasel-linux-x64.tar.gz -C release-linux \
            "$(basename "$appimage")" nightly-linux.yml install-linux.sh

      - name: Package and smoke-test Linux CLI archive
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "${{ needs.preflight.outputs.version }}" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-linux
          path: release-linux/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-cli-linux
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

      - name: Preserve built Linux files after a later failure
        if: ${{ failure() && hashFiles('release-linux/*.AppImage') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weasel-linux-built-diagnostic
          path: release-linux/*
          if-no-files-found: error
          retention-days: 1

  build_nixos:
    if: inputs.recover_desktop_run_id == ''
    needs: [preflight, build_linux]
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Install closure packaging tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Verify updater against a real Nix Store fixture
        run: python3 packaging/nixos/test-updater.py
      - uses: actions/download-artifact@v4
        with:
          name: weasel-release-linux
          path: release-linux
      - name: Build immutable NixOS closure on Blacksmith
        env:
          T3_WEASEL_REPOSITORY: ${{ vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code' }}
        run: bash scripts/weasel/build-nixos-closure.sh "${{ needs.preflight.outputs.version }}" "release-linux/T3-Code-${{ needs.preflight.outputs.version }}-x86_64.AppImage" release-nixos
      - uses: actions/upload-artifact@v4
        with:
          name: weasel-release-nixos
          path: release-nixos/*
          if-no-files-found: error
          retention-days: 1

  build_windows:
    if: inputs.recover_desktop_run_id == ''
    needs: [preflight, build_bundle, build_linux]
    runs-on: ${{ vars.WEASEL_WINDOWS_RUNNER || 'blacksmith-8vcpu-windows-2025' }}
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install Windows build dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Install Spectre-mitigated MSVC runtime libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download shared assets
        uses: actions/download-artifact@v4
        with:
          name: weasel-js-bundle
          path: apps

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download same-build Linux CLI runtime for WSL
        uses: actions/download-artifact@v4
        with:
          name: weasel-release-cli-linux
          path: wsl-runtime

      - name: Build Windows CLI executable
        env:
          VP_NODE_VERSION: "26.8.2"
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build Windows x64 installer and updater metadata
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code' }}
          T3CODE_DESKTOP_APP_ID: com.evilweasel.t3code
          T3CODE_DESKTOP_PRODUCT_NAME: T3 Code (Weasel Nightly)
          T3CODE_DESKTOP_PROFILE: weasel
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "${{ needs.preflight.outputs.version }}" --skip-build --keep-stage --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz --output-dir release-windows
          test -s release-windows/nightly.yml
          tmp_roots=("$RUNNER_TEMP")
          [[ -n "${TEMP:-}" ]] && tmp_roots+=("$TEMP")
          [[ -n "${TMP:-}" ]] && tmp_roots+=("$TMP")
          update_config="$(find "${tmp_roots[@]}" -path '*/resources/app-update.yml' -print -quit 2>/dev/null || true)"
          test -n "$update_config"
          IFS=/ read -r expected_owner expected_repo <<<"${T3CODE_DESKTOP_UPDATE_REPOSITORY}"
          grep -Fq "owner: $expected_owner" "$update_config"
          grep -Fq "repo: $expected_repo" "$update_config"

      - name: Package and smoke-test Windows CLI archive
        shell: bash
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/win32-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform win --arch x64 --version "${{ needs.preflight.outputs.version }}" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-windows
          path: release-windows/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-cli-windows
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  build_android_apk:
    name: Build Morrowbyte Android APK
    needs: [preflight]
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    outputs:
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
      receipt_sha256: ${{ steps.apk.outputs.receipt_sha256 }}
      build_attempt: ${{ steps.apk.outputs.build_attempt }}
    env:
      APP_VARIANT: production
      T3CODE_MOBILE_VERSION: ${{ needs.preflight.outputs.version }}
      MORROWBYTE_ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
      ANDROID_BUILD_TOOLS: "36.0.0"
      CI: "1"
    steps:
      - name: Bind runner-local signing path
        run: printf 'MORROWBYTE_ANDROID_KEYSTORE_PATH=%s/morrowbyte-signing/morrowbyte-release.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact promoted source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install frozen mobile dependency closure
        run: vp install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android build and verification tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Bind source and verify standalone fork configuration
        working-directory: apps/mobile
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node node_modules/expo/bin/cli config --type public --json > "$RUNNER_TEMP/morrowbyte-config.json"
          python3 - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          config = json.loads((Path(os.environ['RUNNER_TEMP']) / 'morrowbyte-config.json').read_text())
          assert config['name'] == 'Morrowbyte'
          assert config['scheme'] == 'morrowbyte'
          assert config['android']['package'] == 'com.morrowbyte.t3code'
          assert config['version'] == os.environ['T3CODE_MOBILE_VERSION']
          assert config['android']['versionCode'] == int(os.environ['MORROWBYTE_ANDROID_VERSION_CODE'])
          assert config['updates']['enabled'] is False and not config['updates'].get('url')
          assert not config.get('owner'), 'Standalone Android must not have an EAS owner.'
          # Sharing/widgets add local iOS extension metadata without binding an EAS project.
          eas_metadata = config.get('extra', {}).get('eas', {})
          for key in ('build', 'experimental', 'ios', 'appExtensions'):
              assert isinstance(eas_metadata, dict) and set(eas_metadata) <= {key}, 'Unexpected EAS account/project configuration.'
              eas_metadata = eas_metadata.get(key, [] if key == 'appExtensions' else {})
          assert isinstance(eas_metadata, list), 'Unexpected EAS extension metadata.'
          PYCONFIG

      - name: Generate Android release project
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: node node_modules/expo/bin/cli prebuild --platform android --no-install --clean

      - name: Materialize own release keystore
        env:
          MORROWBYTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MORROWBYTE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ['MORROWBYTE_ANDROID_KEYSTORE_PATH'])
          target.parent.mkdir(mode=0o700, exist_ok=True)
          encoded = ''.join(os.environ['MORROWBYTE_ANDROID_KEYSTORE_BASE64'].split())
          assert encoded, 'Own Android signing keystore is missing.'
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          PYKEY

      - name: Build signed standalone arm64 APK once
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          MORROWBYTE_ANDROID_STORE_PASSWORD: ${{ secrets.MORROWBYTE_ANDROID_STORE_PASSWORD }}
          MORROWBYTE_ANDROID_KEY_ALIAS: ${{ secrets.MORROWBYTE_ANDROID_KEY_ALIAS }}
          MORROWBYTE_ANDROID_KEY_PASSWORD: ${{ secrets.MORROWBYTE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$MORROWBYTE_ANDROID_KEYSTORE_PATH"
          test -n "$MORROWBYTE_ANDROID_STORE_PASSWORD"
          test "$MORROWBYTE_ANDROID_KEY_ALIAS" = morrowbyte-release
          test -n "$MORROWBYTE_ANDROID_KEY_PASSWORD"
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon --no-configuration-cache \
            -PreactNativeArchitectures=arm64-v8a > "$RUNNER_TEMP/morrowbyte-android-dependencies.txt"
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache -PreactNativeArchitectures=arm64-v8a

      - id: apk
        name: Verify APK signature, embedded bundle, identity and 16KB native alignment
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYAPK'
          import hashlib, json, os, re, shutil, struct, subprocess, zipfile
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          version = os.environ['T3CODE_MOBILE_VERSION']
          assert re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z.+-]*', version)
          code = int(os.environ['MORROWBYTE_ANDROID_VERSION_CODE'])
          assert 0 < code <= 2100000000
          expected_cert = '34a33c2541544bc4a96e359a33e9f71aaa449ee9a0cd725c2469b65b057aa2b2'
          sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools' / os.environ['ANDROID_BUILD_TOOLS']
          built = Path('apps/mobile/android/app/build/outputs/apk/release')
          candidates = list(built.glob('*.apk'))
          assert len(candidates) == 1, 'Expected one standalone release APK.'
          apk = candidates[0]
          signature = subprocess.check_output([str(sdk / 'apksigner'), 'verify', '-Werr', '--verbose', '--print-certs', str(apk)], text=True)
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F:]+)$', signature, re.M)
          assert len(certificates) == 1 and certificates[0].replace(':', '').lower() == expected_cert
          subprocess.run([str(sdk / 'zipalign'), '-c', '-P', '16', '-v', '4', str(apk)], check=True, stdout=subprocess.DEVNULL)
          badging = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          identity = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.M)
          assert identity and identity.groups() == ('com.morrowbyte.t3code', str(code), version)
          assert "application-label:'Morrowbyte'" in badging and 'application-debuggable' not in badging
          for permission in ['INTERNET', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS']:
              assert "name='android.permission." + permission + "'" in badging
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              bundle = 'assets/index.android.bundle'
              assert bundle in names and archive.getinfo(bundle).file_size > 10000
              libraries = [name for name in names if name.startswith('lib/') and name.endswith('.so')]
              assert libraries and {name.split('/')[1] for name in libraries} == {'arm64-v8a'}
              assert any('hermes' in name for name in libraries)
              assert any('jingle_peerconnection' in name or 'webrtc' in name for name in libraries)
              for name in libraries:
                  data = archive.read(name)
                  assert data[:6] == b'\x7fELF\x02\x01', name
                  assert struct.unpack_from('<H', data, 18)[0] == 183, name
                  offset = struct.unpack_from('<Q', data, 32)[0]
                  entry_size, entry_count = struct.unpack_from('<HH', data, 54)
                  loads = 0
                  for index in range(entry_count):
                      header = offset + index * entry_size
                      if struct.unpack_from('<I', data, header)[0] != 1:
                          continue
                      loads += 1
                      file_offset, address = struct.unpack_from('<QQ', data, header + 8)
                      alignment = struct.unpack_from('<Q', data, header + 48)[0]
                      assert alignment >= 16384 and file_offset % 16384 == address % 16384, name
                  assert loads > 0, name
              bundle_sha = hashlib.sha256(archive.read(bundle)).hexdigest()
          output = Path('release-android')
          output.mkdir()
          name = f'Morrowbyte-{version}-android-arm64.apk'
          target = output / name
          shutil.copyfile(apk, target)
          assert digest(target) == digest(apk)
          apk_sha = digest(target)
          (output / (name + '.sha256')).write_text(f'{apk_sha}  {name}\n')
          receipt = {
              'schemaVersion': 1, 'source': source, 'lockSha256': digest(Path('pnpm-lock.yaml')),
              'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'trustedContextSha': os.environ['GITHUB_SHA'], 'trustedWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
              'trustedWorkflowRef': os.environ['GITHUB_WORKFLOW_REF'],
              'package': 'com.morrowbyte.t3code', 'name': 'Morrowbyte', 'version': version, 'versionCode': code,
              'apk': name, 'apkSha256': apk_sha, 'certificateSha256': expected_cert,
              'abis': ['arm64-v8a'], 'embeddedBundle': bundle, 'embeddedBundleSha256': bundle_sha,
              'nativeLibraryCount': len(libraries), 'signatureVerified': True, 'zip16KB': True, 'elf16KB': True,
              'dependencyReportSha256': digest(Path(os.environ['RUNNER_TEMP']) / 'morrowbyte-android-dependencies.txt'),
              'deviceAcceptance': 'not-run',
          }
          receipt_file = output / (name + '.json')
          receipt_file.write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write(f'apk_sha256={apk_sha}\nreceipt_sha256={digest(receipt_file)}\nbuild_attempt={os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          PYAPK

      - name: Upload verified Android release payload
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-android
          path: release-android/*
          if-no-files-found: error
          retention-days: 7

      - name: Preserve resolved Android dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasel-android-build-evidence-${{ needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrowbyte-android-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove ephemeral signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/morrowbyte-signing"

  publish:
    if: >-
      ${{ !cancelled() && inputs.publish && needs.preflight.result == 'success' && needs.build_android_apk.result == 'success' &&
          ((inputs.recover_desktop_run_id == '' && needs.build_bundle.result == 'success' && needs.build_linux.result == 'success' && needs.build_nixos.result == 'success' && needs.build_windows.result == 'success') ||
           (inputs.recover_desktop_run_id == '39093205395' && needs.build_bundle.result == 'skipped' && needs.build_linux.result == 'skipped' && needs.build_nixos.result == 'skipped' && needs.build_windows.result == 'skipped')) }}
    needs: [preflight, build_bundle, build_linux, build_nixos, build_windows, build_android_apk]
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout promoted source for receipt metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Download dedicated release assets
        uses: actions/download-artifact@v4
        with:
          pattern: weasel-release-*
          merge-multiple: true
          path: release-assets

      - name: Download Observatory preflight proof for publication
        if: needs.preflight.outputs.observatory_route_sha256 != ''
        uses: actions/download-artifact@v4
        with:
          name: weasel-observatory-preflight-${{ needs.preflight.outputs.source_sha }}-${{ needs.preflight.outputs.recovery_artifact_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/observatory-publish-preflight

      - name: Download Observatory build proof for publication
        if: needs.preflight.outputs.observatory_route_sha256 != ''
        uses: actions/download-artifact@v4
        with:
          name: weasel-observatory-build-${{ needs.preflight.outputs.source_sha }}-${{ needs.preflight.outputs.recovery_artifact_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/observatory-publish-build

      - name: Require matching Observatory route proofs before publication
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PREFLIGHT_ROUTE_SHA: ${{ needs.preflight.outputs.observatory_route_sha256 }}
          DESKTOP_RUN_ID: ${{ needs.preflight.outputs.desktop_run_id }}
          DESKTOP_RUN_ATTEMPT: ${{ needs.preflight.outputs.desktop_run_attempt }}
          DESKTOP_CONTEXT_SHA: ${{ needs.preflight.outputs.desktop_context_sha }}
          DESKTOP_WORKFLOW_SHA: ${{ needs.preflight.outputs.desktop_workflow_sha }}
          DESKTOP_WORKFLOW_REF: ${{ needs.preflight.outputs.desktop_workflow_ref }}
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            test -z "$PREFLIGHT_ROUTE_SHA"
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert os.environ['PREFLIGHT_ROUTE_SHA'] == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          preflight = root / 'observatory-publish-preflight'
          build = root / 'observatory-publish-build'
          pre = json.loads((preflight / 'receipt.json').read_bytes())
          built = json.loads((build / 'receipt.json').read_bytes())
          for receipt in [pre, built]:
              assert receipt['source'] == source
              assert receipt['run'] == os.environ['DESKTOP_RUN_ID'] and receipt['attempt'] == os.environ['DESKTOP_RUN_ATTEMPT']
              assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
              assert receipt['trustedContextSha'] == os.environ['DESKTOP_CONTEXT_SHA']
              assert receipt['trustedWorkflowSha'] == os.environ['DESKTOP_WORKFLOW_SHA']
              assert receipt['trustedWorkflowRef'] == os.environ['DESKTOP_WORKFLOW_REF']
          assert pre['effectiveSourceSha'] == source and pre['status'] == 'generated-unreviewed'
          assert pre['afterSha256'] == built['generatedRouteSha256'] == expected
          assert digest(preflight / 'routeTree.gen.ts') == digest(build / 'routeTree.gen.ts') == expected
          assert built['preflightReceiptSha256'] == digest(preflight / 'receipt.json')
          assert pre['generatorVersion'] == '1.167.12' and pre['config'] == {'autoCodeSplitting': True}
          assert (preflight / 'routeTree.diff').is_file()
          PYROUTE

      - name: Setup checksum consumer runtime
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Verify Android bytes from this build before publication
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          ANDROID_VERSION: ${{ needs.preflight.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
          APK_SHA256: ${{ needs.build_android_apk.outputs.apk_sha256 }}
          APK_RECEIPT_SHA256: ${{ needs.build_android_apk.outputs.receipt_sha256 }}
          APK_BUILD_ATTEMPT: ${{ needs.build_android_apk.outputs.build_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PYPUBLISHAPK'
          import hashlib, json, os, re
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assets = Path('release-assets')
          version = os.environ['ANDROID_VERSION']
          name = f'Morrowbyte-{version}-android-arm64.apk'
          assert sorted(p.name for p in assets.iterdir() if p.suffix in {'.apk', '.aab', '.ipa'}) == [name]
          expected_sha = os.environ['APK_SHA256']
          assert re.fullmatch('[0-9a-f]{64}', expected_sha)
          receipt_path = assets / (name + '.json')
          assert digest(assets / name) == expected_sha
          assert digest(receipt_path) == os.environ['APK_RECEIPT_SHA256']
          assert (assets / (name + '.sha256')).read_text() == f'{expected_sha}  {name}\n'
          receipt = json.loads(receipt_path.read_text())
          expected = {
              'schemaVersion': 1, 'source': os.environ['SOURCE_SHA'], 'version': version,
              'lockSha256': digest(Path('pnpm-lock.yaml')),
              'versionCode': int(os.environ['ANDROID_VERSION_CODE']),
              'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['APK_BUILD_ATTEMPT'],
              'trustedContextSha': os.environ['GITHUB_SHA'], 'trustedWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
              'trustedWorkflowRef': os.environ['GITHUB_WORKFLOW_REF'],
              'apk': name, 'apkSha256': expected_sha, 'package': 'com.morrowbyte.t3code', 'name': 'Morrowbyte',
              'certificateSha256': '34a33c2541544bc4a96e359a33e9f71aaa449ee9a0cd725c2469b65b057aa2b2',
              'abis': ['arm64-v8a'], 'signatureVerified': True, 'zip16KB': True, 'elf16KB': True,
              'deviceAcceptance': 'not-run',
          }
          assert all(receipt.get(key) == value for key, value in expected.items())
          PYPUBLISHAPK

      - name: Verify the recovered desktop provenance from this preflight
        if: inputs.recover_desktop_run_id != ''
        env:
          RECOVERY_RECEIPT_SHA256: ${{ needs.preflight.outputs.recovery_receipt_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PYDESKTOP'
          import hashlib, json, os
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assets = Path('release-assets')
          receipt = assets / 'DESKTOP-RECOVERY.json'
          assert digest(receipt) == os.environ['RECOVERY_RECEIPT_SHA256']
          for item in json.loads(receipt.read_text())['files']:
              assert Path(item['name']).name == item['name']
              assert digest(assets / item['name']) == item['sha256'], 'Recovered desktop file bytes changed.'
          PYDESKTOP

      - name: Verify isolated release payload
        run: |
          set -euo pipefail
          test -s release-assets/nightly-linux.yml
          test -s release-assets/nightly.yml
          test -s release-assets/weasel-linux-x64.tar.gz
          test -s "release-assets/T3-Code-${{ needs.preflight.outputs.version }}-x86_64.AppImage"
          test -s release-assets/install-linux.sh
          test -s "release-assets/T3-Code-${{ needs.preflight.outputs.version }}-x86_64-linux-nix-closure.nar.zst"
          test -s "release-assets/T3-Code-${{ needs.preflight.outputs.version }}-x86_64-linux-nix-closure.json"
          bash scripts/weasel/verify-nixos-closure.sh "${{ needs.preflight.outputs.version }}" release-assets
          test -n "$(find release-assets -maxdepth 1 -name 't3-*-linux-x64.tar.gz' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name 't3-*-win32-x64.zip' -print -quit)"
          bash scripts/weasel/verify-published-release.sh --write-checksums "${{ needs.preflight.outputs.version }}" release-assets

      - name: Create fork-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code' }}
          OBSERVATORY_ROUTE_SHA: ${{ needs.preflight.outputs.observatory_route_sha256 }}
          DESKTOP_RUN_ID: ${{ needs.preflight.outputs.desktop_run_id }}
          DESKTOP_RUN_ATTEMPT: ${{ needs.preflight.outputs.desktop_run_attempt }}
          DESKTOP_CONTEXT_SHA: ${{ needs.preflight.outputs.desktop_context_sha }}
          DESKTOP_WORKFLOW_SHA: ${{ needs.preflight.outputs.desktop_workflow_sha }}
          DESKTOP_WORKFLOW_REF: ${{ needs.preflight.outputs.desktop_workflow_ref }}
          RECOVERY_WORKFLOW_SHA256: ${{ needs.preflight.outputs.recovery_workflow_sha256 }}
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          source_sha="${{ needs.preflight.outputs.source_sha }}"
          version="${{ needs.preflight.outputs.version }}"
          assert_draft_release() {
            local release_state is_draft target_commitish
            release_state="$(gh release view "$tag" --json isDraft,targetCommitish)"
            is_draft="$(jq -r .isDraft <<<"$release_state")"
            target_commitish="$(jq -r .targetCommitish <<<"$release_state")"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release tag $tag is already published and immutable; refusing to overwrite its assets." >&2
              return 1
            fi
            if [[ "$target_commitish" != "$source_sha" ]]; then
              echo "Release tag $tag already points to $target_commitish, refusing to replace it." >&2
              return 1
            fi
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            release_state="$(gh release view "$tag" --json isDraft,targetCommitish)"
            if [[ "$(jq -r .isDraft <<<"$release_state")" == "false" ]]; then
              bash scripts/weasel/verify-published-release.sh \
                "$tag" "$source_sha" "$version" release-assets
              exit 0
            fi
            assert_draft_release
          else
            gh release create "$tag" \
              --target "$source_sha" \
              --title "Weasel Nightly ${{ needs.preflight.outputs.version }}" \
              --prerelease \
              --draft \
              --notes "Fork channel build from $source_sha. Linux AppImage installs include a user-local installer. NixOS installs use the dedicated package and updater launcher when available at https://github.com/$GH_REPO/tree/main/packaging/nixos. Linux auto-updates stay disabled for Nix store installs. This build has no configured T3 Connect relay backend."
          fi
          # Asset replacement is permitted only while the release is still a
          # draft. Recheck immediately before each clobber in case a maintainer
          # published it while the job was preparing the payload.
          assert_draft_release
          gh release upload "$tag" release-assets/* --clobber

          lock_sha="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          assets_json="$(bash scripts/weasel/read-draft-release-assets.sh "$tag" "$source_sha")"
          jq -e 'length > 0 and all(.[]; (.digest | type == "string") and (.digest | startswith("sha256:")))' <<<"$assets_json"
          expected_assets="$(find release-assets -maxdepth 1 -type f ! -name 'RELEASE-RECEIPT.txt' -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          jq -e --argjson expected "$expected_assets" '([.[].name] | sort) == $expected' <<<"$assets_json"
          {
            printf 'fork_release=%s\nsource_sha=%s\npnpm_lock_sha256=%s\n' "$tag" "$source_sha" "$lock_sha"
            if [[ -f apps/web/src/routes/observatory.tsx ]]; then
              test "$OBSERVATORY_ROUTE_SHA" = 4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e
              printf 'generated_route_sha256=%s\ngenerated_route_source_sha=%s\ngenerated_route_run_id=%s\ngenerated_route_run_attempt=%s\n' \
                "$OBSERVATORY_ROUTE_SHA" "$source_sha" "$DESKTOP_RUN_ID" "$DESKTOP_RUN_ATTEMPT"
            fi
            printf 'desktop_origin_run_id=%s\ndesktop_origin_run_attempt=%s\ndesktop_origin_context_sha=%s\ndesktop_origin_workflow_sha=%s\ndesktop_origin_workflow_ref=%s\n' \
              "$DESKTOP_RUN_ID" "$DESKTOP_RUN_ATTEMPT" "$DESKTOP_CONTEXT_SHA" "$DESKTOP_WORKFLOW_SHA" "$DESKTOP_WORKFLOW_REF"
            printf 'publication_run_id=%s\npublication_run_attempt=%s\npublication_context_sha=%s\npublication_workflow_sha=%s\npublication_workflow_ref=%s\npublication_workflow_sha256=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF" \
              "${RECOVERY_WORKFLOW_SHA256:-$(sha256sum .github/workflows/weasel-release.yml | cut -d ' ' -f 1)}"
            printf 'github_asset_digests=%s\n' "$(jq -c '[.[] | {name, digest}]' <<<"$assets_json")"
            printf 'artifact_sha256:\n'
            cat release-assets/SHA256SUMS
          } > release-assets/RELEASE-RECEIPT.txt
          assert_draft_release
          gh release upload "$tag" release-assets/RELEASE-RECEIPT.txt --clobber
          gh release edit "$tag" --draft=false
