name: Morrowbyte CI

on:
  workflow_dispatch:
    inputs:
      integrationOnly:
        description: Run only the short integration check
        required: false
        default: false
        type: boolean
      integrationBase:
        description: Base ref or SHA for a manual integration check
        required: false
        default: main
        type: string
      qualifyUpstream:
        description: Run the complete Linux upstream test suites for a merge candidate
        required: false
        default: false
        type: boolean
      buildCandidateCLI:
        description: Build an unpublished Linux x64 CLI/service candidate
        required: false
        default: false
        type: boolean
      candidateVersion:
        description: Exact unpublished CLI/service candidate version (nightly.DATE.RUN.CANDIDATE)
        required: false
        default: ""
        type: string
      probeProtonPass:
        description: Run the isolated synthetic Electron extension compatibility probe
        required: false
        default: false
        type: boolean
      qualifyNixUpdater:
        description: Verify updater and configured legacy rollback against a real Nix Store fixture
        required: false
        default: false
        type: boolean
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: morrowbyte-ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cua_runtime:
    if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly && github.repository == (vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code')
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            "${{ vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux' }}",
            "${{ vars.MORROWBYTE_WINDOWS_RUNNER || 'morrowbyte-windows' }}",
          ]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install Linux session prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb dbus-x11 libatspi2.0-0 libgtk-3-0
      - name: Check pinned archives and extraction
        run: node --test packages/cua-driver/runtime.test.mjs
      - name: Verify Linux native SDK and managed MCP transport
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/smoke-cua-runtime.mjs
      - name: Verify Windows native SDK and interactive-session boundary
        if: runner.os == 'Windows'
        run: node scripts/smoke-cua-runtime.mjs --expect-windows-session-zero
  check:
    if: >-
      github.repository == (vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      [
        self-hosted,
        "${{ vars.MORROWBYTE_INTEGRATION_RUNNER || vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux' }}",
      ]
    timeout-minutes: 45
    steps:
      - name: Update the isolated runner checkout
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          repository_url="https://github.com/$GITHUB_REPOSITORY.git"
          if [[ ! -d .git ]]; then
            git init
            git remote add origin "$repository_url"
          fi
          actual_url="$(git remote get-url origin)"
          test "${actual_url%.git}" = "${repository_url%.git}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          CHECKOUT_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)" \
            git --config-env=http.https://github.com/.extraheader=CHECKOUT_HEADER \
            -c protocol.version=2 fetch --no-tags --depth=2 --filter=blob:none origin "$GITHUB_SHA"
          unset CHECKOUT_TOKEN
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffd
      - name: Use the machine's installed Vite toolchain
        run: |
          set -euo pipefail
          for directory in "$HOME/.vite-plus/bin" "$HOME/.local/share/vite-plus/bin"; do
            if [[ -x "$directory/vp" ]]; then
              export PATH="$directory:$PATH"
              printf '%s\n' "$directory" >> "$GITHUB_PATH"
              break
            fi
          done
          command -v vp || { echo 'Install Vite+ once for the runner user before enabling CI.' >&2; exit 1; }
          vp env install
          vp node --version
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Prepare pinned Electron runtime before desktop imports
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - name: Install pinned Chromium for focused renderer gates
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Capture emulated mobile composer before source gates
        if: (github.ref_name == 'feature/mobile-composer-hotfix-candidate-20261016' || github.ref_name == 'feature/mobile-compact-config-candidate-20261016')
        run: |
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin b6525bb5fe4343ea5612ba5e9ec8e1a0b2482791
          if [ "$GITHUB_REF_NAME" = feature/mobile-compact-config-candidate-20261016 ]; then git fetch --no-tags --depth=1 origin a86d942da9e89ed382d2bfd7295b1e90ab2bc429; fi
          node scripts/morrowbyte/voice-ui-artifact.mjs "$RUNNER_TEMP/composer-mobile" --composer-mobile
      - name: Preserve emulated mobile composer development evidence
        if: always() && (github.ref_name == 'feature/mobile-composer-hotfix-candidate-20261016' || github.ref_name == 'feature/mobile-compact-config-candidate-20261016')
        uses: actions/upload-artifact@v4
        with:
          name: composer-mobile-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composer-mobile
          if-no-files-found: error
          retention-days: 7
      - name: Check the integration diff
        if: github.event_name != 'workflow_dispatch' || inputs.integrationOnly
        env:
          BASE_REF: ${{ inputs.integrationBase || github.event.pull_request.base.sha || github.event.before }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ ]]
          if [[ "$BASE_REF" == 0000000000000000000000000000000000000000 ]]; then BASE_REF=main; fi
          CHECKOUT_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)" \
            git --config-env=http.https://github.com/.extraheader=CHECKOUT_HEADER \
            fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_SHA="$(git rev-parse FETCH_HEAD)"
          vp run check:integration --exact-base "$BASE_SHA"
      - name: Run focused source gates
        if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly
        env:
          EFFECTIVE_SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$EFFECTIVE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EFFECTIVE_SOURCE_SHA"
          bash scripts/morrowbyte/check.sh
      - name: Preserve unreviewed Observatory route generation
        if: always() && (github.ref_name == 'feature/agent-observatory-candidate-20261016' || github.ref_name == 'feature/desktop-control-bootstrap-396-20261016')
        uses: actions/upload-artifact@v4
        with:
          name: observatory-routes-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observatory-route-generation/receipt.json
            ${{ runner.temp }}/observatory-route-generation/routeTree.gen.ts
            ${{ runner.temp }}/observatory-route-generation/routeTree.diff
          if-no-files-found: error
          retention-days: 7
      - name: Lint conversational work-control slice
        if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly
        run: >-
          vp lint --report-unused-disable-directives
          apps/web/src/components/ChatView.tsx
          apps/web/src/components/chat/ChatComposer.tsx
          apps/web/src/components/chat/ChatComposer.mobile.browser.test.tsx
          apps/web/src/components/chat/composerTypingGuard.ts
          apps/web/src/components/chat/composerTypingGuard.test.ts
          apps/web/src/components/chat/useComposerTypingGuard.ts
          apps/web/src/voice/VoiceDictationControl.tsx
          apps/web/src/voice/VoiceDictationControl.question.browser.test.tsx
          apps/web/src/voice/LiveVoiceControl.tsx
          apps/web/src/voice/LiveVoiceControl.browser.test.tsx
          apps/web/src/voice/LiveVoiceDraftThread.ts
          apps/web/src/voice/LiveVoiceDraftThread.test.ts
          packages/client-runtime/src/live-voice/controller.ts
          packages/client-runtime/src/live-voice/controller.test.ts
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
          apps/server/src/voice/CodexLiveSessionService.test.ts
          apps/server/src/voice/CodexLiveSessionService.ts
          packages/provider-core/src/server/ProviderAdapter.ts
      - name: Test computer-use browser and editor boundaries
        if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly
        working-directory: apps/server
        run: >-
          vp test run
          src/preview/ServerBrowserPage.test.ts
          src/preview/ServerBrowser.test.ts
          src/mcp/toolkits/preview/PreviewBatch.test.ts
          src/mcp/McpHttpServer.test.ts
          src/integrations/editorLink/EditorFollow.test.ts
          src/integrations/editorLink/EditorFollowAcp.test.ts
      - name: Test voice dictation request deferral
        if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly
        working-directory: apps/web
        run: >-
          vp test run
          src/components/chat/composerTypingGuard.test.ts
          src/voice/VoiceDictationControl.question.browser.test.tsx
      - name: Test background process presentation
        if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly
        run: >-
          vp test run
          packages/client-runtime/src/work-log/commandLabel.test.ts
          packages/client-runtime/src/state/backgroundWorkPresentation.test.ts
      - name: Test background process controls in Chromium
        if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly
        working-directory: apps/web
        run: >-
          vp test run
          src/components/chat/BackgroundWorkActivity.browser.test.tsx
          src/browser/ElectronBrowserHost.browser.test.tsx
  product_bundle:
    needs: [check]
    if: github.event_name == 'workflow_dispatch' && (inputs.buildCandidateCLI || inputs.probeProtonPass)
    runs-on: [self-hosted, "${{ vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux' }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install bundle dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Validate explicit unpublished candidate inputs
        env:
          BUILD_CANDIDATE_CLI: ${{ inputs.buildCandidateCLI || false }}
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_CANDIDATE_CLI" != true ]]; then
            test -z "$CANDIDATE_VERSION"
            exit 0
          fi
          test "$SOURCE_REPOSITORY" = morrowbyte/t3code
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$CANDIDATE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-nightly\.[0-9]{8}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]
          node scripts/update-release-package-versions.ts "$CANDIDATE_VERSION"
      - name: Build product bundle without publishing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          vp run build:desktop
      - name: Capture synthetic voice UI across sizes and themes
        run: node scripts/morrowbyte/voice-ui-artifact.mjs
      - name: Preserve visual fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-${{ github.sha }}
          path: product-evidence/voice-ui
          if-no-files-found: warn
          retention-days: 7
      - name: Probe synthetic Proton extension compatibility on pinned Electron
        if: inputs.probeProtonPass
        timeout-minutes: 5
        env:
          MORROWBYTE_CI_PROBE: "1"
          MORROWBYTE_CI_PROFILE: ${{ vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test apps/desktop/scripts/proton-pass-compatibility.test.mjs
          sudo apt-get install -y xvfb
          proton_probe_electron="$(node apps/desktop/scripts/ensure-electron-runtime.mjs)"
          xvfb-run --auto-servernum node apps/desktop/scripts/proton-pass-compatibility.test.mjs --electron "$proton_probe_electron" --output "$RUNNER_TEMP/proton-pass-compatibility"
      - name: Preserve isolated Electron compatibility receipts
        if: always() && inputs.probeProtonPass
        uses: actions/upload-artifact@v4
        with:
          name: proton-pass-compatibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proton-pass-compatibility/fixture-receipt.json
            ${{ runner.temp }}/proton-pass-compatibility/fixture-receipt.partial.json
            ${{ runner.temp }}/proton-pass-compatibility/runner-receipt.json
            ${{ runner.temp }}/proton-pass-compatibility/electron.log
          if-no-files-found: error
          retention-days: 7
      - name: Setup Linux candidate Rust target
        if: inputs.buildCandidateCLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build complete unpublished Linux CLI candidate
        if: inputs.buildCandidateCLI
        env:
          VP_NODE_VERSION: "26.8.2"
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          monitor_dir="$RUNNER_TEMP/cli-candidate-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$CANDIDATE_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-candidate-resource-monitor" --output-dir product-evidence/linux-cli
          node scripts/smoke-cli-archive.ts --archive "product-evidence/linux-cli/t3-$CANDIDATE_VERSION-linux-x64.tar.gz" --expect-version "$CANDIDATE_VERSION"
          preflight_dir="$(mktemp -d "$RUNNER_TEMP/cli-candidate-preflight.XXXXXX")"
          tar -xf "product-evidence/linux-cli/t3-$CANDIDATE_VERSION-linux-x64.tar.gz" -C "$preflight_dir" --strip-components=1
          "$preflight_dir/t3" __service-preflight --database-path "$preflight_dir/preflight.sqlite" --launcher-protocol 3 > product-evidence/linux-cli/SERVICE-PREFLIGHT.json
          jq -e --arg version "$CANDIDATE_VERSION" '.status == "ready" and .version == $version and .launcherProtocol == 3' product-evidence/linux-cli/SERVICE-PREFLIGHT.json
          printf 'kind=unpublished-cli-service-candidate\nnightly_feed_compatible=false\ndesktop_auto_install=false\nsource_sha=%s\nversion=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$CANDIDATE_VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > product-evidence/linux-cli/CI-CANDIDATE-RECEIPT.txt
          sha256sum pnpm-lock.yaml >> product-evidence/linux-cli/CI-CANDIDATE-RECEIPT.txt
          (cd product-evidence/linux-cli && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Preserve unpublished Linux CLI candidate
        if: inputs.buildCandidateCLI
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli-candidate-${{ github.sha }}
          path: product-evidence/linux-cli
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Bind bundle to exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p product-evidence
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > product-evidence/BUILD-RECEIPT.txt
          sha256sum pnpm-lock.yaml >> product-evidence/BUILD-RECEIPT.txt
          if [[ -f apps/web/src/routes/observatory.tsx ]]; then
            test -s apps/web/src/routeTree.gen.ts
            grep -q '/observatory' apps/web/src/routeTree.gen.ts
            printf 'generated_route_sha256=%s\n' "$(sha256sum apps/web/src/routeTree.gen.ts | cut -d' ' -f1)" >> product-evidence/BUILD-RECEIPT.txt
          fi
          find apps/server/dist apps/desktop/dist-electron -type f -print0 | sort -z | xargs -0 sha256sum > product-evidence/SHA256SUMS
          test -s product-evidence/SHA256SUMS
      - name: Upload reviewable product bundle
        uses: actions/upload-artifact@v4
        with:
          name: product-bundle-${{ github.sha }}
          include-hidden-files: true
          path: |
            apps/server/dist
            apps/desktop/dist-electron
            product-evidence
          if-no-files-found: error
          retention-days: 7
  nix_updater:
    if: github.event_name == 'workflow_dispatch' && inputs.qualifyNixUpdater
    runs-on: [self-hosted, "${{ vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux' }}"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Verify offline updater and previous launcher rollback
        run: python3 packaging/nixos/test-updater.py

  windows_installer_guard:
    if: github.event_name == 'workflow_dispatch' && !inputs.integrationOnly && github.repository == (vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code')
    runs-on: [self-hosted, "${{ vars.MORROWBYTE_WINDOWS_RUNNER || 'morrowbyte-windows' }}"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows installer process isolation
        shell: powershell
        run: ./apps/desktop/resources/test-morrowbyte-installer-guard.ps1

  upstream_tests:
    if: >-
      github.repository == (vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code') &&
      github.event_name == 'workflow_dispatch' && inputs.qualifyUpstream
    runs-on: [self-hosted, "${{ vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux' }}"]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            web,
            packages,
            server-1,
            server-2,
            server-3,
            server-4,
            server-5,
            server-6,
            server-7,
            server-8,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Prepare pinned Electron runtime
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - name: Install native fixture prerequisites
        if: matrix.suite == 'packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsecret-1-dev pkg-config
      - name: Install pinned Chromium for browser tests
        if: matrix.suite == 'web' || startsWith(matrix.suite, 'server-')
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - name: Run complete upstream test suite
        env:
          QUALIFICATION_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$QUALIFICATION_SUITE" in
            web) vp run --filter @t3tools/web test ;;
            packages) vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test ;;
            server-*) vp run --filter t3 test --shard "${QUALIFICATION_SUITE#server-}/8" ;;
            *) exit 1 ;;
          esac
