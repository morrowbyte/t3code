name: WinDev canary readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windev-canary-readiness
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, morrowbyte-windows]
    timeout-minutes: 3
    steps:
      - name: Read target identity and existing runtime health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = [ordered]@{
            targetMatchesWinDev = $env:COMPUTERNAME -eq 'WINDEV2407EVAL'
            desktopRunning = @(Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -match '^(t3code|Crew|Morrowbyte)$' }).Count -gt 0
            sshClientRunning = @(Get-Process ssh -ErrorAction SilentlyContinue).Count -gt 0
            sshServiceRunning = (Get-Service sshd -ErrorAction SilentlyContinue).Status -eq 'Running'
          }
          $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue)
          foreach ($port in @(3773, 3780, 3785, 3786)) {
            $report['listening' + $port] = @($listeners | Where-Object LocalPort -eq $port).Count -gt 0
          }
          if ($report.targetMatchesWinDev) {
            $report.existingStartupRepairScript = Test-Path -LiteralPath ($env:LOCALAPPDATA + '\Morrowbyte\Start-Desktop.ps1')
            $tasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object {
              @($_.Actions | Where-Object { $_.Arguments -match 'Start-Desktop\.ps1' }).Count -gt 0
            })
            $report.existingRepairTaskCount = $tasks.Count
            $report.existingInteractiveRepairTask = @($tasks | Where-Object {
              $_.Principal.LogonType -in @('Interactive', 'InteractiveOrPassword')
            }).Count -eq 1
          }
          if (Get-Command Get-VM -ErrorAction SilentlyContinue) {
            try {
              $vms = @(Get-VM | Where-Object { $_.Name -match 'windev' })
              $report.existingWinDevVmCount = $vms.Count
              $report.existingWinDevVmRunning = @($vms | Where-Object State -eq 'Running').Count -gt 0
            } catch { $report.vmStatusAvailable = $false }
          }
          $report | ConvertTo-Json -Depth 3
