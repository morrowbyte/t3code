name: Repair Windows release tool launchers
on:
  push:
    branches: [ops/windows-vp-release109]
    paths: [.github/workflows/morrowbyte-windows-vp-repair.yml]

permissions: {}
concurrency:
  group: morrowbyte-windows-vp-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'morrowbyte/t3code'
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_WINDOWS_RUNNER || 'morrowbyte-windows')) }}
    timeout-minutes: 5
    steps:
      - name: Repair the stale runner-local Vite+ launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $globalVp = Join-Path $env:USERPROFILE '.vite-plus\bin\vp.exe'
          $shim = Join-Path $env:USERPROFILE 'crew-actions-runner\tools\vite-plus\node_modules\.bin\vp.cmd'
          $backup = "$shim.release109-original"
          foreach ($file in @($globalVp, $shim)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required launcher missing: $file" }
          }
          & $globalVp env --help
          if ($LASTEXITCODE -ne 0) { throw 'The installed global Vite+ CLI did not pass its probe.' }
          $original = [IO.File]::ReadAllBytes($shim)
          $wrapper = "@echo off`r`n`"%USERPROFILE%\.vite-plus\bin\vp.exe`" %*`r`nexit /b %ERRORLEVEL%`r`n"
          if (-not (Test-Path -LiteralPath $backup)) {
            [IO.File]::WriteAllBytes($backup, $original)
          } elseif ([IO.File]::ReadAllText($shim) -ne $wrapper) {
            throw 'An existing repair backup belongs to a different launcher state.'
          }
          try {
            [IO.File]::WriteAllText($shim, $wrapper, [Text.Encoding]::ASCII)
            & $shim env --help
            if ($LASTEXITCODE -ne 0) { throw 'The repaired launcher did not pass its probe.' }
          } catch {
            [IO.File]::WriteAllBytes($shim, $original)
            throw
          }
          Write-Host "Runner launcher repaired. Original retained at $backup"

      - name: Prepare a full 7-Zip launcher for release jobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chocolatey = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { Join-Path $env:ProgramData 'chocolatey' }
          $portableRoot = Join-Path $env:USERPROFILE 'crew-actions-runner\tools\7zip-26.06'
          $candidates = @(
            foreach ($root in @($env:ProgramFiles, $env:ProgramW6432, ${env:ProgramFiles(x86)})) {
              if ($root) { Join-Path $root '7-Zip\7z.exe' }
            }
            Join-Path $env:LOCALAPPDATA 'Programs\7-Zip\7z.exe'
            foreach ($package in @('7zip', '7zip.install', '7zip.commandline')) {
              Join-Path $chocolatey "lib\$package\tools\7z.exe"
            }
            if (Test-Path -LiteralPath $portableRoot -PathType Container) {
              Get-ChildItem -LiteralPath $portableRoot -Filter '7z.exe' -File -Recurse | ForEach-Object { $_.FullName }
            }
          ) | Select-Object -Unique
          $sevenZip = $null
          foreach ($candidate in $candidates) {
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
            try { $probe = & $candidate i 2>&1 } catch { continue }
            if ($LASTEXITCODE -eq 0 -and ($probe -match '\bNsis\b')) {
              $sevenZip = (Resolve-Path -LiteralPath $candidate).Path
              break
            }
          }
          if (-not $sevenZip) {
            $msi = Join-Path $env:RUNNER_TEMP 'crew-7z2606-x64.msi'
            try {
              Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.06/7z2606-x64.msi' -OutFile $msi -TimeoutSec 60
              $digest = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -ne '6dc822569e777d9a3ecd5ffcbc22b55600af87e6c5d9810a64e8566cf5a4af9f') {
                throw 'The official 7-Zip MSI SHA-256 did not match.'
              }
              $arguments = "/a `"$msi`" /qn /norestart TARGETDIR=`"$portableRoot`""
              $process = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\msiexec.exe') -ArgumentList $arguments -Wait -PassThru -NoNewWindow
              if ($process.ExitCode -ne 0) { throw "7-Zip administrative extraction failed with exit code $($process.ExitCode)." }
              foreach ($candidate in (Get-ChildItem -LiteralPath $portableRoot -Filter '7z.exe' -File -Recurse)) {
                $probe = & $candidate.FullName i 2>&1
                if ($LASTEXITCODE -eq 0 -and ($probe -match '\bNsis\b')) {
                  $sevenZip = $candidate.FullName
                  break
                }
              }
              if (-not $sevenZip) { throw 'The extracted 7-Zip executable did not provide NSIS support.' }
            } finally {
              if (Test-Path -LiteralPath $msi) { Remove-Item -LiteralPath $msi -ErrorAction SilentlyContinue }
            }
          }
          $shim = Join-Path $env:USERPROFILE 'crew-actions-runner\tools\vite-plus\node_modules\.bin\7z.cmd'
          $wrapper = "@echo off`r`n`"$sevenZip`" %*`r`nexit /b %ERRORLEVEL%`r`n"
          $created = -not (Test-Path -LiteralPath $shim)
          if (-not $created -and [IO.File]::ReadAllText($shim) -ne $wrapper) {
            throw 'An unexpected 7z.cmd already exists; it was not changed.'
          }
          try {
            if ($created) { [IO.File]::WriteAllText($shim, $wrapper, [Text.Encoding]::ASCII) }
            $probe = & $shim i 2>&1
            if ($LASTEXITCODE -ne 0 -or -not ($probe -match '\bNsis\b')) {
              throw 'The 7-Zip launcher did not pass its NSIS support probe.'
            }
          } catch {
            if ($created -and (Test-Path -LiteralPath $shim)) { Remove-Item -LiteralPath $shim }
            throw
          }
          Write-Host "Release 7-Zip launcher ready: $sevenZip"

      - name: Schedule an idle restart with corrected runner module paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'crew-actions-runner'
          $legacy = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $probe = '$ErrorActionPreference = "Stop"; Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PSHOME "powershell.exe") | Out-Null'
          $probePassed = $false
          try {
            $probeOutput = & $legacy -NoLogo -NoProfile -NonInteractive -Command $probe 2>&1
            $probePassed = $LASTEXITCODE -eq 0
          } catch {}
          $global:LASTEXITCODE = 0
          if ($probePassed) {
            Write-Host 'A fresh Windows PowerShell shell already resolves Get-FileHash; no restart scheduled.'
            return
          }
          $listenerExe = Join-Path $root 'bin\Runner.Listener.exe'
          $owned = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -ieq $listenerExe })
          if ($owned.Count -ne 1 -or $owned[0].ProcessId -ne 7044) {
            throw 'The expected manually started runner listener changed; no restart was scheduled.'
          }
          $taskName = 'CrewRunnerModulePathRepair109'
          if (Get-ScheduledTask -TaskName $taskName -TaskPath '\' -ErrorAction SilentlyContinue) {
            throw 'The one-off repair task already exists; inspect it before scheduling another.'
          }
          $tools = Join-Path $root 'tools'
          $scriptFile = Join-Path $tools 'module-path-repair109-v1.ps1'
          $logFile = Join-Path $tools 'module-path-repair109-v1.log'
          $environmentFile = Join-Path $root '.env'
          $backup = "$environmentFile.release109-original"
          foreach ($file in @($scriptFile, $logFile, $backup)) {
            if (Test-Path -LiteralPath $file) { throw "Existing repair state was not overwritten: $file" }
          }
          $hadEnvironment = Test-Path -LiteralPath $environmentFile -PathType Leaf
          $original = if ($hadEnvironment) { [IO.File]::ReadAllBytes($environmentFile) } else { $null }
          $lines = if ($hadEnvironment) { @([IO.File]::ReadAllLines($environmentFile) | Where-Object { $_ -notmatch '^PSModulePath=' }) } else { @() }
          $coreModules = (Join-Path $PSHOME 'Modules').TrimEnd('\')
          $paths = @(
            Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
            Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
            Join-Path $env:USERPROFILE 'Documents\WindowsPowerShell\Modules'
            $env:PSModulePath -split ';' | Where-Object { $_ -and $_.TrimEnd('\') -ine $coreModules }
          ) | Select-Object -Unique
          $lines += "PSModulePath=$($paths -join ';')"
          $encoding = [Text.UTF8Encoding]::new($false)
          $script = @'
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath((Join-Path $PSScriptRoot '..'))
          $log = Join-Path $PSScriptRoot 'module-path-repair109-v1.log'
          function Write-RepairLog([string]$message) {
            [IO.File]::AppendAllText($log, ('{0:o} {1}' -f [DateTime]::UtcNow, $message) + [Environment]::NewLine)
          }
          try {
            if ([Security.Principal.WindowsIdentity]::GetCurrent().User.Value -ne '__USER_SID__') {
              throw 'The scheduled task is not running as the original user.'
            }
            $workerExe = Join-Path $root 'bin\Runner.Worker.exe'
            $listenerExe = Join-Path $root 'bin\Runner.Listener.exe'
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            while (@(Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe'" | Where-Object { $_.ExecutablePath -ieq $workerExe }).Count) {
              if ([DateTime]::UtcNow -ge $deadline) { throw 'The owned runner did not become idle; nothing was stopped.' }
              Start-Sleep -Seconds 3
            }
            $environmentFile = Join-Path $root '.env'
            $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([IO.File]::ReadAllBytes($environmentFile)))
            if ($digest -ne '__ENV_HASH__') { throw 'Runner environment changed after preparation; nothing was stopped.' }
            $listeners = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -ieq $listenerExe })
            if ($listeners.Count -ne 1 -or $listeners[0].ProcessId -ne 7044) {
              throw 'The expected idle listener identity changed; nothing was stopped.'
            }
            $listener = [Diagnostics.Process]::GetProcessById(7044)
            $null = $listener.Handle
            if ($listener.Path -ine $listenerExe) { throw 'Listener executable identity changed; nothing was stopped.' }
            if (@(Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe'" | Where-Object { $_.ExecutablePath -ieq $workerExe }).Count) {
              throw 'An owned worker appeared before restart; nothing was stopped.'
            }
            $run = Join-Path $root 'run.cmd'
            if (-not (Test-Path -LiteralPath $run -PathType Leaf)) { throw 'The runner launcher is missing; nothing was stopped.' }
            Write-RepairLog 'Stopping only the verified idle listener 7044.'
            Stop-Process -InputObject $listener -ErrorAction Stop
            Start-Sleep -Seconds 2
            $listeners = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -ieq $listenerExe })
            if ($listeners.Count -gt 1) { throw 'Multiple owned listeners appeared; no additional runner was started.' }
            if ($listeners.Count -eq 0) {
              Start-Process -FilePath $env:ComSpec -ArgumentList ('/d /c "{0}"' -f $run) -WorkingDirectory $root -WindowStyle Hidden
              Write-RepairLog 'Started this runner through its existing run.cmd.'
            } else { Write-RepairLog 'A replacement owned listener already appeared; it was retained.' }
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $listeners = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -ieq $listenerExe })
              if ($listeners.Count) { break }
              Start-Sleep -Seconds 2
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($listeners.Count -ne 1) { throw 'A single replacement listener was not observed.' }
            Write-RepairLog "Replacement listener observed: $($listeners[0].ProcessId). A fresh job must verify Get-FileHash."
          } catch {
            Write-RepairLog $_.Exception.Message
            exit 1
          }
          '@
          $userSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          try {
            if ($hadEnvironment) { Copy-Item -LiteralPath $environmentFile -Destination $backup }
            [IO.File]::WriteAllLines($environmentFile, [string[]]$lines, $encoding)
            $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([IO.File]::ReadAllBytes($environmentFile)))
            $script = $script.Replace('__USER_SID__', $userSid).Replace('__ENV_HASH__', $digest)
            [IO.File]::WriteAllText($scriptFile, $script, $encoding)
            $action = New-ScheduledTaskAction -Execute (Join-Path $PSHOME 'pwsh.exe') -Argument ('-NoLogo -NoProfile -NonInteractive -File "{0}"' -f $scriptFile)
            $principal = New-ScheduledTaskPrincipal -UserId $userSid -LogonType Interactive -RunLevel Limited
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(30)
            $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 3) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            Register-ScheduledTask -TaskName $taskName -TaskPath '\' -Action $action -Principal $principal -Trigger $trigger -Settings $settings | Out-Null
          } catch {
            if ($hadEnvironment) { [IO.File]::WriteAllBytes($environmentFile, $original) }
            elseif (Test-Path -LiteralPath $environmentFile) { Remove-Item -LiteralPath $environmentFile }
            if (Test-Path -LiteralPath $scriptFile) { Remove-Item -LiteralPath $scriptFile }
            throw
          }
          Write-Host "Scheduled one idle restart as the current user. Repair log: $logFile"
          Write-Host 'Scheduling is not verification: the next fresh runner job must pass Get-FileHash.'
