          if-no-files-found: error
          retention-days: 1

  build_android_apk:
    name: Build Morrowbyte Android APK
    if: ${{ !inputs.windows_candidate_only && !inputs.windows_only && !inputs.desktop_only && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' }}
    needs: [preflight]
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 60
    outputs:
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
      receipt_sha256: ${{ steps.startup_receipt.outputs.receipt_sha256 }}
      build_attempt: ${{ steps.apk.outputs.build_attempt }}
    env:
      DESKTOP_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      RESTORE_ANDROID74: ${{ inputs.restore_android74 }}
      APP_VARIANT: production
      T3CODE_MOBILE_VERSION: ${{ needs.preflight.outputs.version }}
      MORROWBYTE_ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
      ANDROID_BUILD_TOOLS: "36.0.0"
      CI: "1"
    steps:
      - name: Bind runner-local signing path
        run: printf 'MORROWBYTE_ANDROID_KEYSTORE_PATH=%s/morrowbyte-signing/morrowbyte-release.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact promoted source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Retain the reviewed control startup gate for the historical app source
        if: inputs.restore_android74
        run: |
          set -euo pipefail
          test "$DESKTOP_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = 135802e2d15a46d796c7fa736e6da4c82c5b1d20
          git fetch --no-tags --depth=1 origin "$DESKTOP_SOURCE_SHA"
          git show "$DESKTOP_SOURCE_SHA:scripts/morrowbyte/android-startup-smoke.sh" > "$RUNNER_TEMP/morrowbyte-android-startup-smoke.sh"
          test -s "$RUNNER_TEMP/morrowbyte-android-startup-smoke.sh"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install frozen mobile dependency closure
        run: vp install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android build and verification tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0 emulator system-images;android-36;google_apis;x86_64"
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Bind source and verify standalone fork configuration
        working-directory: apps/mobile
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node node_modules/expo/bin/cli config --type public --json > "$RUNNER_TEMP/morrowbyte-config.json"
          python3 - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          config = json.loads((Path(os.environ['RUNNER_TEMP']) / 'morrowbyte-config.json').read_text())
          assert config['name'] == 'Crew'
          assert config['scheme'] == 'morrowbyte'
          assert config['android']['package'] == 'com.morrowbyte.t3code'
          assert config['version'] == os.environ['T3CODE_MOBILE_VERSION']
          assert config['android']['versionCode'] == int(os.environ['MORROWBYTE_ANDROID_VERSION_CODE'])
          assert config['updates']['enabled'] is False and not config['updates'].get('url')
          assert not config.get('owner'), 'Standalone Android must not have an EAS owner.'
          # Sharing/widgets add local iOS extension metadata without binding an EAS project.
          eas_metadata = config.get('extra', {}).get('eas', {})
          assert isinstance(eas_metadata, dict), 'Unexpected EAS account/project configuration.'
          eas_metadata = dict(eas_metadata)
          if 'observe' in eas_metadata:
              assert eas_metadata.pop('observe') == {'endpointUrl': 'https://observe.invalid'}, 'Unexpected EAS observe configuration.'
          for key in ('build', 'experimental', 'ios', 'appExtensions'):
              assert isinstance(eas_metadata, dict) and set(eas_metadata) <= {key}, 'Unexpected EAS account/project configuration.'
              eas_metadata = eas_metadata.get(key, [] if key == 'appExtensions' else {})
          assert isinstance(eas_metadata, list), 'Unexpected EAS extension metadata.'
          PYCONFIG

      - name: Generate Android release project
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: node node_modules/expo/bin/cli prebuild --platform android --no-install --clean

      - name: Split shipping ARM64 and emulator x86_64 from one release build
        run: |
          set -euo pipefail
          python3 - <<'PYSPLITS'
          from pathlib import Path
          gradle = Path('apps/mobile/android/app/build.gradle')
          text = gradle.read_text()
          assert text.count('android {\n') == 1 and 'splits {' not in text
          text = text.replace('android {\n', '''android {
              defaultConfig {
                  externalNativeBuild {
                      cmake {
                          arguments "-DCMAKE_JOB_POOLS=crew_compile=2;crew_link=1",
                              "-DCMAKE_JOB_POOL_COMPILE=crew_compile",
                              "-DCMAKE_JOB_POOL_LINK=crew_link"
                      }
                  }
              }
              splits {
                  abi {
                      reset()
                      enable true
                      universalApk false
                      include "arm64-v8a", "x86_64"
                  }
              }
          ''', 1)
          gradle.write_text(text)
          PYSPLITS

      - name: Materialize own release keystore
        env:
          MORROWBYTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MORROWBYTE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ['MORROWBYTE_ANDROID_KEYSTORE_PATH'])
          target.parent.mkdir(mode=0o700, exist_ok=True)
          encoded = ''.join(os.environ['MORROWBYTE_ANDROID_KEYSTORE_BASE64'].split())
          assert encoded, 'Own Android signing keystore is missing.'
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          PYKEY

      - name: Build signed ARM64 shipping and x86_64 startup splits once
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          MORROWBYTE_ANDROID_STORE_PASSWORD: ${{ secrets.MORROWBYTE_ANDROID_STORE_PASSWORD }}
          MORROWBYTE_ANDROID_KEY_ALIAS: ${{ secrets.MORROWBYTE_ANDROID_KEY_ALIAS }}
          MORROWBYTE_ANDROID_KEY_PASSWORD: ${{ secrets.MORROWBYTE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$MORROWBYTE_ANDROID_KEYSTORE_PATH"
          test -n "$MORROWBYTE_ANDROID_STORE_PASSWORD"
          test "$MORROWBYTE_ANDROID_KEY_ALIAS" = morrowbyte-release
          test -n "$MORROWBYTE_ANDROID_KEY_PASSWORD"
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon --no-configuration-cache --max-workers=2 --no-parallel \
            -PreactNativeArchitectures=arm64-v8a,x86_64 > "$RUNNER_TEMP/morrowbyte-android-dependencies.txt"
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --max-workers=2 --no-parallel -PreactNativeArchitectures=arm64-v8a,x86_64

      - id: apk
        name: Verify APK signature, embedded bundle, identity and 16KB native alignment
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYAPK'
          import hashlib, json, os, re, shutil, struct, subprocess, zipfile
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          version = os.environ['T3CODE_MOBILE_VERSION']
          assert re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z.+-]*', version)
          code = int(os.environ['MORROWBYTE_ANDROID_VERSION_CODE'])
          assert 0 < code <= 2100000000
          restoring = os.environ.get('RESTORE_ANDROID74') == 'true'
          if restoring:
              assert code > 75 and source == '135802e2d15a46d796c7fa736e6da4c82c5b1d20'
              assert digest(Path('pnpm-lock.yaml')) == 'db45b4aacebe846fca988d07543edcf1751fdd17aeeb22d8a23d77c83662f66f'
          expected_cert = '34a33c2541544bc4a96e359a33e9f71aaa449ee9a0cd725c2469b65b057aa2b2'
          sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools' / os.environ['ANDROID_BUILD_TOOLS']
          built = Path('apps/mobile/android/app/build/outputs/apk/release')
          candidates = list(built.glob('*.apk'))
          assert len(candidates) == 2, 'Expected one shipping ARM64 and one CI-only x86_64 split.'
          by_abi = {}
          for candidate in candidates:
              with zipfile.ZipFile(candidate) as archive:
                  abis = {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
                  assert len(abis) == 1 and next(iter(abis)) not in by_abi
                  by_abi[next(iter(abis))] = candidate
          assert set(by_abi) == {'arm64-v8a', 'x86_64'}
          apk = by_abi['arm64-v8a']
          startup_apk = by_abi['x86_64']
          startup_signature = subprocess.check_output([str(sdk / 'apksigner'), 'verify', '-Werr', '--print-certs', str(startup_apk)], text=True)
          startup_certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F:]+)$', startup_signature, re.M)
          assert len(startup_certificates) == 1 and startup_certificates[0].replace(':', '').lower() == expected_cert
          startup_badging = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', str(startup_apk)], text=True)
          startup_identity = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", startup_badging, re.M)
          assert startup_identity and startup_identity.groups() == ('com.morrowbyte.t3code', str(code), version)
          assert 'application-debuggable' not in startup_badging
          signature = subprocess.check_output([str(sdk / 'apksigner'), 'verify', '-Werr', '--verbose', '--print-certs', str(apk)], text=True)
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F:]+)$', signature, re.M)
          assert len(certificates) == 1 and certificates[0].replace(':', '').lower() == expected_cert
          subprocess.run([str(sdk / 'zipalign'), '-c', '-P', '16', '-v', '4', str(apk)], check=True, stdout=subprocess.DEVNULL)
          badging = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          identity = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.M)
          assert identity and identity.groups() == ('com.morrowbyte.t3code', str(code), version)
          assert "application-label:'Crew'" in badging and 'application-debuggable' not in badging
          for permission in ['INTERNET', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS']:
              assert "name='android.permission." + permission + "'" in badging
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              bundle = 'assets/index.android.bundle'
              assert bundle in names and archive.getinfo(bundle).file_size > 10000
              libraries = [name for name in names if name.startswith('lib/') and name.endswith('.so')]
              assert libraries and {name.split('/')[1] for name in libraries} == {'arm64-v8a'}
              assert any('hermes' in name for name in libraries)
              assert any('jingle_peerconnection' in name or 'webrtc' in name for name in libraries)
              for name in libraries:
                  data = archive.read(name)
                  assert data[:6] == b'\x7fELF\x02\x01', name
                  assert struct.unpack_from('<H', data, 18)[0] == 183, name
                  offset = struct.unpack_from('<Q', data, 32)[0]
                  entry_size, entry_count = struct.unpack_from('<HH', data, 54)
                  loads = 0
                  for index in range(entry_count):
                      header = offset + index * entry_size
                      if struct.unpack_from('<I', data, header)[0] != 1:
                          continue
                      loads += 1
                      file_offset, address = struct.unpack_from('<QQ', data, header + 8)
                      alignment = struct.unpack_from('<Q', data, header + 48)[0]
                      assert alignment >= 16384 and file_offset % 16384 == address % 16384, name
                  assert loads > 0, name
              bundle_sha = hashlib.sha256(archive.read(bundle)).hexdigest()
          with zipfile.ZipFile(startup_apk) as archive:
              assert hashlib.sha256(archive.read(bundle)).hexdigest() == bundle_sha, 'Both ABI splits must embed the identical shipping Hermes bundle.'
          generated_bundle = Path('apps/mobile/android/app/build/generated/assets/react/release/index.android.bundle')
          assert generated_bundle.is_file() and digest(generated_bundle) == bundle_sha, 'APK must embed the bundle generated from the pinned source.'
          output = Path('release-android')
          output.mkdir()
          name = f'Morrowbyte-{version}-android-arm64.apk'
          target = output / name
          shutil.copyfile(apk, target)
          assert digest(target) == digest(apk)
          apk_sha = digest(target)
          (output / (name + '.sha256')).write_text(f'{apk_sha}  {name}\n')
          receipt = {
              'schemaVersion': 1, 'source': source, 'desktopSource': os.environ['DESKTOP_SOURCE_SHA'],
              'lockSha256': digest(Path('pnpm-lock.yaml')),
              'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'trustedContextSha': os.environ['GITHUB_SHA'], 'trustedWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
              'trustedWorkflowRef': os.environ['GITHUB_WORKFLOW_REF'],
              'package': 'com.morrowbyte.t3code', 'name': 'Crew', 'version': version, 'versionCode': code,
              'apk': name, 'apkSha256': apk_sha, 'certificateSha256': expected_cert,
              'abis': ['arm64-v8a'], 'embeddedBundle': bundle, 'embeddedBundleSha256': bundle_sha,
              'nativeLibraryCount': len(libraries), 'signatureVerified': True, 'zip16KB': True, 'elf16KB': True,
              'dependencyReportSha256': digest(Path(os.environ['RUNNER_TEMP']) / 'morrowbyte-android-dependencies.txt'),
              'deviceAcceptance': 'not-run',
          }
          if restoring:
              receipt['restoration'] = {
                  'purpose': 'restore-published-android74', 'source': source,
                  'previousRelease': 'v0.1.4-nightly.20261027.74', 'sourceCiRun': '40582582053',
                  'controlSource': os.environ['DESKTOP_SOURCE_SHA'], 'replacesBrokenVersionCode': 75,
                  'appDataReset': False, 'physicalUpgradeAcceptance': 'not-run',
              }
          receipt_file = output / (name + '.json')
          receipt_file.write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write(f'apk_sha256={apk_sha}\nstartup_apk={startup_apk}\nbuild_attempt={os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          PYAPK

      - name: Verify Android emulator KVM access
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "The Android runner needs read and write access to /dev/kvm." >&2
            exit 1
          fi

      - name: Start the minified release on Android 16 before publication
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
          STARTUP_APK: ${{ steps.apk.outputs.startup_apk }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/morrowbyte-android-startup"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/morrowbyte-android-avd"
          export ANDROID_SERIAL=emulator-5554
          mkdir -p "$evidence_dir" "$ANDROID_AVD_HOME"
          if adb -s "$ANDROID_SERIAL" get-state >/dev/null 2>&1; then
            echo 'The CI emulator port is already in use.' >&2
            exit 1
          fi
          avdmanager create avd --force --name Crew_Release_API36 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_7_pro <<< no > "$evidence_dir/avd-create.txt" 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd Crew_Release_API36 -port 5554 \
            -no-window -no-boot-anim -no-snapshot -noaudio -gpu swiftshader_indirect \
            -accel on -cores 4 -memory 4096 > "$evidence_dir/emulator.txt" 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            status=$?
            trap - EXIT
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_emulator EXIT
          boot_deadline=$((SECONDS + 180))
          until [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= boot_deadline )); then
              echo 'The Android 16 CI emulator did not boot.' >&2
              exit 1
            fi
            sleep 2
          done
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          startup_script=scripts/morrowbyte/android-startup-smoke.sh
          if [[ "${RESTORE_ANDROID74:-false}" == true ]]; then
            startup_script="$RUNNER_TEMP/morrowbyte-android-startup-smoke.sh"
          fi
          sha256sum "$startup_script" > "$evidence_dir/startup-script.sha256"
          bash "$startup_script" \
            "release-android/Morrowbyte-$T3CODE_MOBILE_VERSION-android-arm64.apk" \
            "$STARTUP_APK" "$evidence_dir" "$SOURCE_SHA"

      - id: startup_receipt
        name: Bind successful emulator startup to the ARM64 shipping receipt
        run: |
          set -euo pipefail
          python3 - <<'PYSTARTUP'
          import hashlib, json, os
          from pathlib import Path
          receipt = Path('release-android') / f'Morrowbyte-{os.environ["T3CODE_MOBILE_VERSION"]}-android-arm64.apk.json'
          proof = json.loads((Path(os.environ['RUNNER_TEMP']) / 'morrowbyte-android-startup/startup.json').read_text())
          data = json.loads(receipt.read_text())
          assert proof['status'] == 'passed' and proof['uiBeyondSplash'] is True and proof['startupErrors'] is False
          assert proof['source'] == data['source'] and proof['productionApkSha256'] == data['apkSha256']
          assert proof['embeddedBundleSha256'] == data['embeddedBundleSha256']
          assert proof['run'] == data['run'] and proof['attempt'] == data['attempt']
          assert proof['startupAbi'] == 'x86_64' and proof['physicalDeviceAcceptance'] is False
          startup_script = Path(os.environ['RUNNER_TEMP']) / 'morrowbyte-android-startup-smoke.sh' if os.environ.get('RESTORE_ANDROID74') == 'true' else Path('scripts/morrowbyte/android-startup-smoke.sh')
          proof['startupScriptSha256'] = hashlib.sha256(startup_script.read_bytes()).hexdigest()
          data['ciEmulatorStartup'] = proof
          receipt.write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write(f'receipt_sha256={hashlib.sha256(receipt.read_bytes()).hexdigest()}\n')
          PYSTARTUP

      - name: Preserve bounded Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-android-startup-${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrowbyte-android-startup/*
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload verified Android release payload
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-android
          path: release-android/*
          if-no-files-found: error
          retention-days: 7

      - name: Preserve resolved Android dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-android-build-evidence-${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morrowbyte-android-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove ephemeral signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/morrowbyte-signing"

  publish:
    if: >-
      ${{ !cancelled() && inputs.publish && !inputs.windows_only && !inputs.android_only && needs.preflight.result == 'success' &&
          ((inputs.desktop_only && needs.build_android_apk.result == 'skipped') || (!inputs.desktop_only && needs.build_android_apk.result == 'success') || (inputs.recover_windows_run_id == '39182028263' && !inputs.desktop_only && needs.build_android_apk.result == 'skipped') || ((inputs.continue_release68_run_id == '40291055865' || inputs.continue_release68_run_id == '40297878651') && !inputs.desktop_only && needs.build_android_apk.result == 'skipped')) &&
          ((inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id && needs.build_bundle.result == 'success' && needs.build_linux.result == 'success' && needs.build_nixos.result == 'success' && needs.build_windows.result == 'success') ||
           (inputs.continue_release75_run_id == '40821076738' && needs.build_bundle.result == 'skipped' && needs.build_linux.result == 'skipped' && needs.build_nixos.result == 'skipped' && needs.build_windows.result == 'skipped') ||
           (inputs.recover_desktop_run_id == '39093205395' && needs.build_bundle.result == 'skipped' && needs.build_linux.result == 'skipped' && needs.build_nixos.result == 'skipped' && needs.build_windows.result == 'skipped') ||
           (inputs.recover_windows_run_id == '39182028263' && needs.build_bundle.result == 'skipped' && needs.build_linux.result == 'skipped' && needs.build_nixos.result == 'skipped' && needs.build_windows.result == 'success') ||
           (inputs.continue_release68_run_id == '40291055865' && needs.build_bundle.result == 'skipped' && needs.build_linux.result == 'success' && needs.build_nixos.result == 'success' && needs.build_windows.result == 'success') ||
           (inputs.continue_release68_run_id == '40297878651' && needs.build_bundle.result == 'skipped' && needs.build_linux.result == 'skipped' && needs.build_nixos.result == 'success' && needs.build_windows.result == 'skipped')) }}
    needs: [preflight, build_bundle, build_linux, build_nixos, build_windows, build_android_apk]
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout promoted source for receipt metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Download dedicated release assets
        uses: actions/download-artifact@v4
        with:
          pattern: morrowbyte-release-*
          merge-multiple: true
          path: release-assets

      - name: Download Observatory preflight proof for publication
        if: needs.preflight.outputs.observatory_route_sha256 != ''
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-observatory-preflight-${{ needs.preflight.outputs.source_sha }}-${{ needs.preflight.outputs.recovery_artifact_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/observatory-publish-preflight

      - name: Download Observatory build proof for publication
        if: needs.preflight.outputs.observatory_route_sha256 != ''
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-observatory-build-${{ needs.preflight.outputs.source_sha }}-${{ needs.preflight.outputs.recovery_artifact_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/observatory-publish-build

      - name: Require matching Observatory route proofs before publication
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PREFLIGHT_ROUTE_SHA: ${{ needs.preflight.outputs.observatory_route_sha256 }}
          DESKTOP_RUN_ID: ${{ needs.preflight.outputs.desktop_run_id }}
          DESKTOP_RUN_ATTEMPT: ${{ needs.preflight.outputs.desktop_run_attempt }}
          DESKTOP_CONTEXT_SHA: ${{ needs.preflight.outputs.desktop_context_sha }}
          DESKTOP_WORKFLOW_SHA: ${{ needs.preflight.outputs.desktop_workflow_sha }}
          DESKTOP_WORKFLOW_REF: ${{ needs.preflight.outputs.desktop_workflow_ref }}
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            test -z "$PREFLIGHT_ROUTE_SHA"
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          source = os.environ['SOURCE_SHA']
          expected = {
              'ce275176a119b1a2c599c23e6acd7d537cc4c336': '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e',
              'd9e730bfa6fb363206f6b10efc5334daaa69ecc8': '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e',
              'be6292cd24dfe799ce9fcabed5a125c324ae5d06': 'fa1b95cb16c59c5a6bf92647b1bb3f3ab872c4cb06ef7a0e5e723775fb5c3dcc',
          }.get(source, os.environ['PREFLIGHT_ROUTE_SHA'])
          assert len(expected) == 64 and all(c in '0123456789abcdef' for c in expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert os.environ['PREFLIGHT_ROUTE_SHA'] == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          preflight = root / 'observatory-publish-preflight'
          build = root / 'observatory-publish-build'
          pre = json.loads((preflight / 'receipt.json').read_bytes())
          built = json.loads((build / 'receipt.json').read_bytes())
          for receipt in [pre, built]:
              assert receipt['source'] == source
              assert receipt['run'] == os.environ['DESKTOP_RUN_ID'] and receipt['attempt'] == os.environ['DESKTOP_RUN_ATTEMPT']
              assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
              assert receipt['trustedContextSha'] == os.environ['DESKTOP_CONTEXT_SHA']
              assert receipt['trustedWorkflowSha'] == os.environ['DESKTOP_WORKFLOW_SHA']
              assert receipt['trustedWorkflowRef'] == os.environ['DESKTOP_WORKFLOW_REF']
          assert pre['effectiveSourceSha'] == source and pre['status'] == 'generated-unreviewed'
          assert pre['afterSha256'] == built['generatedRouteSha256'] == expected
          assert digest(preflight / 'routeTree.gen.ts') == digest(build / 'routeTree.gen.ts') == expected
          assert built['preflightReceiptSha256'] == digest(preflight / 'receipt.json')
          assert pre['generatorVersion'] and pre['config'] == {'autoCodeSplitting': True}
          assert (preflight / 'routeTree.diff').is_file()
          PYROUTE

      - name: Setup checksum consumer runtime
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Verify Android bytes from this build before publication
        if: ${{ !inputs.desktop_only }}
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
          DESKTOP_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          ANDROID_LOCK_SHA256: ${{ needs.preflight.outputs.android_lock_sha256 }}
          ANDROID_VERSION: ${{ needs.preflight.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.preflight.outputs.android_version_code }}
          APK_SHA256: ${{ needs.preflight.outputs.recovered_apk_sha256 || needs.build_android_apk.outputs.apk_sha256 }}
          APK_RECEIPT_SHA256: ${{ needs.preflight.outputs.recovered_apk_receipt_sha256 || needs.build_android_apk.outputs.receipt_sha256 }}
          APK_BUILD_ATTEMPT: ${{ needs.preflight.outputs.continuation_android_run_attempt || (inputs.recover_windows_run_id != '' && needs.preflight.outputs.desktop_run_attempt || needs.build_android_apk.outputs.build_attempt) }}
          APK_BUILD_RUN: ${{ needs.preflight.outputs.continuation_android_run_id || (inputs.recover_windows_run_id != '' && needs.preflight.outputs.desktop_run_id || github.run_id) }}
          APK_CONTEXT_SHA: ${{ needs.preflight.outputs.continuation_android_context_sha || (inputs.recover_windows_run_id != '' && needs.preflight.outputs.desktop_context_sha || github.sha) }}
          APK_WORKFLOW_SHA: ${{ needs.preflight.outputs.continuation_android_workflow_sha || (inputs.recover_windows_run_id != '' && needs.preflight.outputs.desktop_workflow_sha || github.workflow_sha) }}
          APK_WORKFLOW_REF: ${{ needs.preflight.outputs.continuation_android_workflow_ref || (inputs.recover_windows_run_id != '' && needs.preflight.outputs.desktop_workflow_ref || github.workflow_ref) }}
        run: |
          set -euo pipefail
          python3 - <<'PYPUBLISHAPK'
          import hashlib, json, os, re
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assets = Path('release-assets')
          version = os.environ['ANDROID_VERSION']
          name = f'Morrowbyte-{version}-android-arm64.apk'
          assert sorted(p.name for p in assets.iterdir() if p.suffix in {'.apk', '.aab', '.ipa'}) == [name]
          expected_sha = os.environ['APK_SHA256']
          assert re.fullmatch('[0-9a-f]{64}', expected_sha)
          receipt_path = assets / (name + '.json')
          assert digest(assets / name) == expected_sha
          assert digest(receipt_path) == os.environ['APK_RECEIPT_SHA256']
          assert (assets / (name + '.sha256')).read_text() == f'{expected_sha}  {name}\n'
          receipt = json.loads(receipt_path.read_text())
          assert receipt['name'] in {'Crew', 'Morrowbyte'}
          expected = {
              'schemaVersion': 1, 'source': os.environ['SOURCE_SHA'], 'version': version,
              'desktopSource': os.environ['DESKTOP_SOURCE_SHA'],
              'lockSha256': os.environ['ANDROID_LOCK_SHA256'] or digest(Path('pnpm-lock.yaml')),
              'versionCode': int(os.environ['ANDROID_VERSION_CODE']),
              'run': os.environ['APK_BUILD_RUN'], 'attempt': os.environ['APK_BUILD_ATTEMPT'],
              'trustedContextSha': os.environ['APK_CONTEXT_SHA'], 'trustedWorkflowSha': os.environ['APK_WORKFLOW_SHA'],
              'trustedWorkflowRef': os.environ['APK_WORKFLOW_REF'],
              'apk': name, 'apkSha256': expected_sha, 'package': 'com.morrowbyte.t3code',
              'name': 'Crew' if os.environ['APK_BUILD_RUN'] == os.environ['GITHUB_RUN_ID'] else receipt['name'],
              'certificateSha256': '34a33c2541544bc4a96e359a33e9f71aaa449ee9a0cd725c2469b65b057aa2b2',
              'abis': ['arm64-v8a'], 'signatureVerified': True, 'zip16KB': True, 'elf16KB': True,
              'deviceAcceptance': 'not-run',
          }
          assert all(receipt.get(key) == value for key, value in expected.items())
          PYPUBLISHAPK

      - name: Verify the recovered desktop provenance from this preflight
        if: inputs.recover_desktop_run_id != ''
        env:
          RECOVERY_RECEIPT_SHA256: ${{ needs.preflight.outputs.recovery_receipt_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PYDESKTOP'
          import hashlib, json, os
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assets = Path('release-assets')
          receipt = assets / 'DESKTOP-RECOVERY.json'
          assert digest(receipt) == os.environ['RECOVERY_RECEIPT_SHA256']
          for item in json.loads(receipt.read_text())['files']:
              assert Path(item['name']).name == item['name']
              assert digest(assets / item['name']) == item['sha256'], 'Recovered desktop file bytes changed.'
          PYDESKTOP

      - name: Verify retained .59 platform bytes and original provenance
        if: inputs.recover_windows_run_id != ''
        env:
          RECOVERY_RECEIPT_SHA256: ${{ needs.preflight.outputs.windows_recovery_receipt_sha256 }}
          PACKAGING_SHA256: ${{ needs.preflight.outputs.windows_packaging_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PYWINDOWSBYTES'
          import hashlib, json, os
          from pathlib import Path
          digest = lambda p: hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
          assets = Path('release-assets')
          receipt = assets / 'WINDOWS-RECOVERY.json'
          assert digest(receipt) == os.environ['RECOVERY_RECEIPT_SHA256']
          recovery = json.loads(receipt.read_bytes())
          assert recovery['source'] == 'd9e730bfa6fb363206f6b10efc5334daaa69ecc8' and recovery['version'] == '0.1.2-nightly.20261019.59'
          assert recovery['originRun'] == '39182028263' and recovery['originAttempt'] == '1'
          assert recovery['controlSource'] == os.environ['GITHUB_SHA']
          assert recovery['windowsPackagingScriptSha256'] == os.environ['PACKAGING_SHA256']
          for item in recovery['files']:
              assert Path(item['name']).name == item['name']
              assert digest(assets / item['name']) == item['sha256'], 'Retained platform file bytes changed.'
          PYWINDOWSBYTES

      - name: Verify original .75 platform bytes before publication
        if: inputs.continue_release75_run_id != ''
        env:
          CONTROL_SHA: ${{ github.sha }}
          RECOVERY75_RECEIPT_SHA256: ${{ needs.preflight.outputs.recovery75_receipt_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_SHA"
          git show "$CONTROL_SHA:scripts/morrowbyte/release75-continuation.py" > "$RUNNER_TEMP/release75-continuation.py"
          python3 "$RUNNER_TEMP/release75-continuation.py" verify release-assets

      - name: Verify isolated release payload
        env:
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
        run: |
          set -euo pipefail
          if [[ "$DESKTOP_ONLY" == true ]]; then
            test -z "$(find release-assets -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -print -quit)"
          fi
          test -s release-assets/nightly-linux.yml
          test -s release-assets/nightly.yml
          test -s release-assets/morrowbyte-linux-x64.tar.gz
          test -s "release-assets/T3-Code-${{ needs.preflight.outputs.version }}-x86_64.AppImage"
          test -s release-assets/install-linux.sh
          test -s "release-assets/T3-Code-${{ needs.preflight.outputs.version }}-x86_64-linux-nix-closure.nar.zst"
          test -s "release-assets/T3-Code-${{ needs.preflight.outputs.version }}-x86_64-linux-nix-closure.json"
          bash scripts/morrowbyte/verify-nixos-closure.sh "${{ needs.preflight.outputs.version }}" release-assets
          test -n "$(find release-assets -maxdepth 1 -name 't3-*-linux-x64.tar.gz' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name 't3-*-win32-x64.zip' -print -quit)"
          bash scripts/morrowbyte/verify-published-release.sh --write-checksums "${{ needs.preflight.outputs.version }}" release-assets

      - name: Create fork-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code' }}
          OBSERVATORY_ROUTE_SHA: ${{ needs.preflight.outputs.observatory_route_sha256 }}
          DESKTOP_RUN_ID: ${{ needs.preflight.outputs.desktop_run_id }}
          DESKTOP_RUN_ATTEMPT: ${{ needs.preflight.outputs.desktop_run_attempt }}
          DESKTOP_CONTEXT_SHA: ${{ needs.preflight.outputs.desktop_context_sha }}
          DESKTOP_WORKFLOW_SHA: ${{ needs.preflight.outputs.desktop_workflow_sha }}
          DESKTOP_WORKFLOW_REF: ${{ needs.preflight.outputs.desktop_workflow_ref }}
          RECOVERY_WORKFLOW_SHA256: ${{ needs.preflight.outputs.recovery_workflow_sha256 }}
          ANDROID_SOURCE_SHA: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
          ANDROID_LOCK_SHA256: ${{ needs.preflight.outputs.android_lock_sha256 }}
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
          WINDOWS_RECOVERY_RUN_ID: ${{ inputs.recover_windows_run_id }}
          CONTINUATION68_RUN_ID: ${{ inputs.continue_release68_run_id }}
          CONTINUATION75_RUN_ID: ${{ inputs.continue_release75_run_id }}
          RECOVERY75_RECEIPT_SHA256: ${{ needs.preflight.outputs.recovery75_receipt_sha256 }}
          WINDOWS_PACKAGING_SHA256: ${{ needs.preflight.outputs.windows_packaging_sha256 }}
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          source_sha="${{ needs.preflight.outputs.source_sha }}"
          version="${{ needs.preflight.outputs.version }}"
          assert_draft_release() {
            local release_state is_draft target_commitish
            release_state="$(gh release view "$tag" --json isDraft,targetCommitish)"
            is_draft="$(jq -r .isDraft <<<"$release_state")"
            target_commitish="$(jq -r .targetCommitish <<<"$release_state")"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release tag $tag is already published and immutable; refusing to overwrite its assets." >&2
              return 1
            fi
            if [[ "$target_commitish" != "$source_sha" ]]; then
              echo "Release tag $tag already points to $target_commitish, refusing to replace it." >&2
              return 1
            fi
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            release_state="$(gh release view "$tag" --json isDraft,targetCommitish)"
            if [[ "$(jq -r .isDraft <<<"$release_state")" == "false" ]]; then
              bash scripts/morrowbyte/verify-published-release.sh \
                "$tag" "$source_sha" "$version" release-assets
              exit 0
            fi
            assert_draft_release
          else
            if [[ "$DESKTOP_ONLY" == true ]]; then
              platform_notes="Desktop-only hotfix for Windows x64, Linux x64 and NixOS x64. No Android or macOS assets were built for this release."
            else
              platform_notes="Android source $ANDROID_SOURCE_SHA."
            fi
            if [[ -n "$WINDOWS_RECOVERY_RUN_ID" ]]; then
              platform_notes+=" Retained Linux, NixOS, Android and shared runtime bytes from run $WINDOWS_RECOVERY_RUN_ID. Windows packaging uses validation-only script $WINDOWS_PACKAGING_SHA256 from control source $GITHUB_SHA; application source and version remain unchanged."
            fi
            if [[ -n "$CONTINUATION68_RUN_ID" ]]; then
              platform_notes+=" Corrected desktop/server bundle retained unchanged from run 40291055865. The signed Android package is retained unchanged from run 40293470700 at the same application source. Linux and Windows packages use private dependency copies. The release version is unchanged."
            fi
            if [[ "$CONTINUATION68_RUN_ID" == 40297878651 ]]; then
              platform_notes+=" Linux, Windows and CLI package bytes are retained unchanged from run 40297878651; only the missing NixOS closure is built in this publication run."
            fi
            if [[ "$CONTINUATION75_RUN_ID" == 40821076738 ]]; then
              platform_notes+=" Desktop, NixOS and CLI bytes are retained unchanged from run 40821076738. Only the missing source-matching Android package is built in this continuation."
            fi
            gh release create "$tag" \
              --target "$source_sha" \
              --title "Morrowbyte Nightly ${{ needs.preflight.outputs.version }}" \
              --prerelease \
              --draft \
              --notes "Fork channel desktop source $source_sha. $platform_notes Linux AppImage installs include a user-local installer. NixOS installs use the dedicated package and updater launcher when available at https://github.com/$GH_REPO/tree/main/packaging/nixos. Linux auto-updates stay disabled for Nix store installs. This build has no configured T3 Connect relay backend."
          fi
          # Asset replacement is permitted only while the release is still a
          # draft. Recheck immediately before each clobber in case a maintainer
          # published it while the job was preparing the payload.
          assert_draft_release
          gh release upload "$tag" release-assets/* --clobber

          lock_sha="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          assets_json="$(bash scripts/morrowbyte/read-draft-release-assets.sh "$tag" "$source_sha")"
          jq -e 'length > 0 and all(.[]; (.digest | type == "string") and (.digest | startswith("sha256:")))' <<<"$assets_json"
          expected_assets="$(find release-assets -maxdepth 1 -type f ! -name 'RELEASE-RECEIPT.txt' -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          jq -e --argjson expected "$expected_assets" '([.[].name] | sort) == $expected' <<<"$assets_json"
          {
            printf 'fork_release=%s\nsource_sha=%s\npnpm_lock_sha256=%s\n' "$tag" "$source_sha" "$lock_sha"
            if [[ -f apps/web/src/routes/observatory.tsx ]]; then
              case "$source_sha" in
                ce275176a119b1a2c599c23e6acd7d537cc4c336|d9e730bfa6fb363206f6b10efc5334daaa69ecc8) expected_route=4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e ;;
                be6292cd24dfe799ce9fcabed5a125c324ae5d06) expected_route=fa1b95cb16c59c5a6bf92647b1bb3f3ab872c4cb06ef7a0e5e723775fb5c3dcc ;;
                *) expected_route="$(jq -er '.afterSha256' "$RUNNER_TEMP/observatory-publish-preflight/receipt.json")" ;;
              esac
              test "$OBSERVATORY_ROUTE_SHA" = "$expected_route"
              printf 'generated_route_sha256=%s\ngenerated_route_source_sha=%s\ngenerated_route_run_id=%s\ngenerated_route_run_attempt=%s\n' \
                "$OBSERVATORY_ROUTE_SHA" "$source_sha" "$DESKTOP_RUN_ID" "$DESKTOP_RUN_ATTEMPT"
            fi
            printf 'desktop_origin_run_id=%s\ndesktop_origin_run_attempt=%s\ndesktop_origin_context_sha=%s\ndesktop_origin_workflow_sha=%s\ndesktop_origin_workflow_ref=%s\n' \
              "$DESKTOP_RUN_ID" "$DESKTOP_RUN_ATTEMPT" "$DESKTOP_CONTEXT_SHA" "$DESKTOP_WORKFLOW_SHA" "$DESKTOP_WORKFLOW_REF"
            printf 'publication_run_id=%s\npublication_run_attempt=%s\npublication_context_sha=%s\npublication_workflow_sha=%s\npublication_workflow_ref=%s\npublication_workflow_sha256=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF" \
              "${RECOVERY_WORKFLOW_SHA256:-$(sha256sum .github/workflows/morrowbyte-release.yml | cut -d ' ' -f 1)}"
            if [[ -n "$WINDOWS_RECOVERY_RUN_ID" ]]; then
              printf 'retained_platform_origin_run_id=%s\nretained_platform_origin_run_attempt=1\nwindows_build_run_id=%s\nwindows_build_run_attempt=%s\nwindows_application_source_sha=%s\nwindows_packaging_control_sha=%s\nwindows_packaging_script_sha256=%s\n' \
                "$WINDOWS_RECOVERY_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$source_sha" "$GITHUB_SHA" "$WINDOWS_PACKAGING_SHA256"
            fi
            if [[ "$DESKTOP_ONLY" == true ]]; then
              printf 'release_platforms=windows-x64,linux-x64,nixos-x64\nandroid_status=not-built-desktop-only\n'
            else
              printf 'android_source_sha=%s\nandroid_pnpm_lock_sha256=%s\n' \
                "$ANDROID_SOURCE_SHA" "${ANDROID_LOCK_SHA256:-$lock_sha}"
            fi
            if [[ -n "$CONTINUATION68_RUN_ID" ]]; then
              printf 'retained_bundle_origin_run_id=40291055865\nretained_bundle_origin_attempt=1\ndesktop_packaging_run_id=%s\ndesktop_packaging_context_sha=%s\nretained_android_origin_run_id=40293470700\ncli_build_node_version=26.12.1\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
              if [[ "$CONTINUATION68_RUN_ID" == 40297878651 ]]; then
                printf 'retained_desktop_packages_run_id=40297878651\nnixos_packaging_run_id=%s\n' "$GITHUB_RUN_ID"
              fi
            fi
            if [[ "$CONTINUATION75_RUN_ID" == 40821076738 ]]; then
              printf 'retained_platform_origin_run_id=40821076738\nretained_platform_origin_run_attempt=1\nretained_platform_recovery_receipt_sha256=%s\nandroid_build_run_id=%s\nandroid_build_run_attempt=%s\n' \
                "$RECOVERY75_RECEIPT_SHA256" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            fi
            printf 'github_asset_digests=%s\n' "$(jq -c '[.[] | {name, digest}]' <<<"$assets_json")"
            printf 'artifact_sha256:\n'
            cat release-assets/SHA256SUMS
          } > release-assets/RELEASE-RECEIPT.txt
          assert_draft_release
          gh release upload "$tag" release-assets/RELEASE-RECEIPT.txt --clobber
          gh release edit "$tag" --draft=false

  publish_android:
    if: inputs.android_only && inputs.publish
    needs: [preflight, build_android_apk]
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.preflight.outputs.android_source_sha || needs.preflight.outputs.source_sha }}
      CONTROL_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      RESTORE_ANDROID74: ${{ inputs.restore_android74 }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      SOURCE_CI_RUN: ${{ needs.preflight.outputs.restored_source_ci_run_id || needs.preflight.outputs.source_ci_run_id }}
      CONTROL_SOURCE_CI_RUN: ${{ needs.preflight.outputs.source_ci_run_id }}
      APK_SHA256: ${{ needs.build_android_apk.outputs.apk_sha256 }}
      APK_RECEIPT_SHA256: ${{ needs.build_android_apk.outputs.receipt_sha256 }}
    steps:
      - name: Checkout exact Android release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Download only the verified Android payload
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-release-android
          path: release-assets

      - name: Bind APK to this source, build and signing proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE_SHA"
          test "$RELEASE_TAG" = "android/v$VERSION"
          test -n "$SOURCE_CI_RUN"
          python3 - <<'PYANDROID'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release-assets')
          apk = root / f'Morrowbyte-{os.environ["VERSION"]}-android-arm64.apk'
          receipt = apk.with_name(apk.name + '.json')
          digest = lambda p: hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
          assert digest(apk) == os.environ['APK_SHA256']
          assert digest(receipt) == os.environ['APK_RECEIPT_SHA256']
          proof = json.loads(receipt.read_bytes())
          assert proof['source'] == os.environ['SOURCE_SHA']
          assert proof['run'] == os.environ['GITHUB_RUN_ID'] and str(proof['attempt']) == os.environ['GITHUB_RUN_ATTEMPT']
          assert proof['trustedContextSha'] == os.environ['GITHUB_SHA']
          assert proof['trustedWorkflowSha'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert proof['trustedWorkflowRef'] == os.environ['GITHUB_WORKFLOW_REF']
          if os.environ.get('RESTORE_ANDROID74') == 'true':
              assert proof['source'] == '135802e2d15a46d796c7fa736e6da4c82c5b1d20' and proof['versionCode'] > 75
              assert proof['certificateSha256'] == '34a33c2541544bc4a96e359a33e9f71aaa449ee9a0cd725c2469b65b057aa2b2'
              assert proof['restoration']['purpose'] == 'restore-published-android74'
              assert proof['restoration']['controlSource'] == os.environ['CONTROL_SOURCE_SHA']
              assert proof['ciEmulatorStartup']['status'] == 'passed'
          PYANDROID
          bash scripts/morrowbyte/verify-published-release.sh --android-only --write-checksums "$VERSION" release-assets

      - name: Publish the same Android bytes without changing desktop feeds
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/android-release-state.json" 2> "$RUNNER_TEMP/android-release-view.err"; then
            if [[ "$(jq -r .isDraft "$RUNNER_TEMP/android-release-state.json")" == false ]]; then
              bash scripts/morrowbyte/verify-published-release.sh --android-only "$RELEASE_TAG" "$SOURCE_SHA" "$VERSION" release-assets
              exit 0
            fi
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/android-release-state.json")" = "$SOURCE_SHA"
          else
            if [[ "${RESTORE_ANDROID74:-false}" == true ]]; then
              cat > "$RUNNER_TEMP/android-release-notes.md" <<'RESTORENOTES'
          Android-Notfallwiederherstellung für Crew:
          - Enthält den zuvor veröffentlichten Android-Anwendungsstand .74 mit höherem Versionscode. Neuere .75-Funktionen sind darin nicht enthalten.
          - Über die bestehende App installieren, ohne Deinstallation oder Löschen der Appdaten. Paket und Produktionssignatur bleiben gleich.
          - Der Start wird auf Android 16/API 36 mit identischem Hermesbundle im x86_64-Emulator geprüft. Eine physische S24- oder bestehende Pairingdaten-Abnahme wird nicht behauptet.

          Anwendungsquelle und aktueller Steuerungscommit stehen getrennt im APK-Beleg. Dieses Release ersetzt ausschließlich die Android-App; Desktop-Feeds bleiben unverändert.
          RESTORENOTES
            else
              cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Android-Update für Morrowbyte:
          - Ein bewusst gestartetes Voicegespräch bleibt beim Wechsel in den Hintergrund und beim Sperren des Bildschirms aktiv. Ende gibt Mikrofon, Audio und Sitzung wieder frei.
          - Das Transkript öffnet am neuesten Ende und folgt neuen Inhalten. Beim manuellen Zurückscrollen bleibt die Position erhalten; einzelne Beiträge lassen sich vollständig kopieren.
          - Kurze Statusaktualisierungen beim Zurückkehren beenden das laufende Gespräch nicht mehr.

          Die APK normal über die bestehende App installieren, ohne vorherige Deinstallation. Paket und Produktionssignatur bleiben gleich; Profile und Verbindungen werden erhalten. Dieses Release enthält ausschließlich Android. Die bisherigen Desktop-Updates und deren Assets bleiben bestehen.

          Die Entwicklungsabnahme erfolgt im vorhandenen Emulator. Eine physische S24-, Mikrofon- oder ASR-Abnahme wird damit nicht behauptet. APK-Quellstand, Signatur, ARM64, eingebettetes Bundle und Ausrichtung sind in den beigefügten Belegen ausgewiesen.
          NOTES
            fi
            # A namespaced, non-latest release also stays out of private electron-updater's unfiltered prerelease list.
            release_title="Morrowbyte Android Nightly $VERSION"
            if [[ "${RESTORE_ANDROID74:-false}" == true ]]; then
              release_title="Crew Android Restore $VERSION (.74)"
            fi
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "$release_title" --notes-file "$RUNNER_TEMP/android-release-notes.md" --draft --latest=false
          fi
          assert_draft() {
            gh release view "$RELEASE_TAG" --json isDraft,targetCommitish |
              jq -e --arg source "$SOURCE_SHA" '.isDraft == true and .targetCommitish == $source' >/dev/null
          }
          assert_draft
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          assets="$(bash scripts/morrowbyte/read-draft-release-assets.sh "$RELEASE_TAG" "$SOURCE_SHA")"
          expected="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          jq -e --argjson expected "$expected" '([.[].name] | sort) == $expected and all(.[]; (.digest | type == "string") and (.digest | startswith("sha256:")))' <<< "$assets" >/dev/null
          printf '%s\n' "$assets" > "$RUNNER_TEMP/android-draft-assets.json"
          python3 - <<'PYDIGESTS'
          import hashlib, json, os, pathlib
          assets = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-draft-assets.json').read_bytes())
          for asset in assets:
              path = pathlib.Path('release-assets') / asset['name']
              assert asset['digest'] == 'sha256:' + hashlib.file_digest(path.open('rb'), 'sha256').hexdigest(), asset['name']
          PYDIGESTS
          {
            printf 'fork_release=%s\nsource_sha=%s\nrelease_platforms=android-arm64\n' "$RELEASE_TAG" "$SOURCE_SHA"
            printf 'version=%s\nsource_ci_run_id=%s\npublication_run_id=%s\npublication_run_attempt=%s\n' "$VERSION" "$SOURCE_CI_RUN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            if [[ "${RESTORE_ANDROID74:-false}" == true ]]; then
              printf 'restoration=published-android74\ncontrol_source_sha=%s\ncontrol_source_ci_run_id=%s\n' "$CONTROL_SOURCE_SHA" "$CONTROL_SOURCE_CI_RUN"
            fi
            printf 'publication_context_sha=%s\npublication_workflow_sha=%s\npublication_workflow_ref=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF"
            printf 'github_asset_digests=%s\nartifact_sha256:\n' "$(jq -c '[.[] | {name, digest}]' <<< "$assets")"
            cat release-assets/SHA256SUMS
          } > release-assets/RELEASE-RECEIPT.txt
          assert_draft
          gh release upload "$RELEASE_TAG" release-assets/RELEASE-RECEIPT.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false --prerelease=false
          bash scripts/morrowbyte/verify-published-release.sh --android-only "$RELEASE_TAG" "$SOURCE_SHA" "$VERSION" release-assets

  publish_windows:
    if: >-
      ${{ !cancelled() && inputs.publish && inputs.windows_only &&
          needs.preflight.result == 'success' && needs.build_bundle.result == 'success' &&
          needs.build_windows.result == 'success' && needs.build_linux.result == 'skipped' &&
          needs.build_nixos.result == 'skipped' && needs.build_android_apk.result == 'skipped' }}
    needs: [preflight, build_bundle, build_linux, build_nixos, build_windows, build_android_apk]
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout promoted source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install release metadata tools
        run: vp install --frozen-lockfile --filter=@t3tools/shared...
      - name: Download qualified Windows bytes
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-release-windows
          path: release-assets
      - name: Download qualified Windows CLI bytes
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-release-cli-windows
          path: release-assets
      - name: Publish Windows-only payload with preserved Linux feed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/morrowbyte/windows-only-release.cjs publish release-assets
