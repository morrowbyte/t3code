name: Morrowbyte desktop nightly
run-name: Morrowbyte ${{ inputs.windows_only && 'Windows' || inputs.android_only && 'Android' || 'desktop' }} release ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      runner_backend:
        description: Own runners by default; Blacksmith only for an explicitly authorized run
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - blacksmith
      publish:
        description: Publish the built release (false keeps artifacts only)
        type: boolean
        default: true
      source_sha:
        description: Exact source commit (fork main for publishing, dispatched branch for artifacts only)
        required: true
        type: string
      desktop_only:
        description: Build and publish only Windows, Linux and NixOS desktop assets
        type: boolean
        default: false
      windows_only:
        description: Build only Windows; reuse the unchanged published .61 WSL runtime and preserve other platform feeds
        type: boolean
        default: false
      windows_candidate_only:
        description: Build an unpublished Windows installer with a fresh current-source WSL runtime
        type: boolean
        default: false
      android_only:
        description: Build and publish only the signed Android ARM64 APK, leaving desktop feeds unchanged
        type: boolean
        default: false
      restore_android74:
        description: Emergency Android-only restore of the published .74 source with a higher version code
        type: boolean
        default: false
      recover_desktop_run_id:
        description: One-off .48 recovery only (39093205395); reuse desktop bytes and build only Android
        type: string
        default: ""

      recover_windows_run_id:
        description: One-off .59 recovery only (39182028263); rebuild Windows and reuse successful platform bytes
        type: string
        default: ""

      continue_release68_run_id:
        description: Exact .68 continuation only (40291055865); reuse the corrected bundle and build Android from its exact source
        type: string
        default: ""

      continue_release75_run_id:
        description: Exact .75 continuation only (40821076738); retain desktop bytes and build the missing Android package
        type: string
        default: ""

      android_source_sha:
        description: Exact separately reviewed APK source for .48 recovery; empty uses desktop source
        type: string
        default: ""

concurrency:
  group: morrowbyte-desktop-nightly
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    if: github.repository == (vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code')
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.continuation75.outputs.source_sha || steps.continuation.outputs.source_sha || steps.windows_recovery.outputs.source_sha || steps.recovery.outputs.source_sha || steps.release.outputs.source_sha }}
      version: ${{ steps.continuation75.outputs.version || steps.continuation.outputs.version || steps.windows_recovery.outputs.version || steps.recovery.outputs.version || steps.release.outputs.version }}
      android_version_code: ${{ steps.continuation75.outputs.android_version_code || steps.continuation.outputs.android_version_code || steps.windows_recovery.outputs.android_version_code || steps.recovery.outputs.android_version_code || steps.release.outputs.android_version_code }}
      tag: ${{ steps.continuation75.outputs.tag || steps.continuation.outputs.tag || steps.windows_recovery.outputs.tag || steps.recovery.outputs.tag || steps.release.outputs.tag }}
      observatory_route_sha256: ${{ steps.continuation75.outputs.observatory_route_sha256 || steps.continuation.outputs.observatory_route_sha256 || steps.windows_recovery.outputs.observatory_route_sha256 || steps.recovery.outputs.observatory_route_sha256 || steps.route.outputs.observatory_route_sha256 }}
      desktop_run_id: ${{ steps.continuation75.outputs.desktop_run_id || steps.continuation.outputs.desktop_run_id || steps.windows_recovery.outputs.desktop_run_id || steps.recovery.outputs.desktop_run_id || github.run_id }}
      desktop_run_attempt: ${{ steps.continuation75.outputs.desktop_run_attempt || steps.continuation.outputs.desktop_run_attempt || steps.windows_recovery.outputs.desktop_run_attempt || steps.recovery.outputs.desktop_run_attempt || github.run_attempt }}
      desktop_context_sha: ${{ steps.continuation75.outputs.desktop_context_sha || steps.continuation.outputs.desktop_context_sha || steps.windows_recovery.outputs.desktop_context_sha || steps.recovery.outputs.desktop_context_sha || github.sha }}
      desktop_workflow_sha: ${{ steps.continuation75.outputs.desktop_workflow_sha || steps.continuation.outputs.desktop_workflow_sha || steps.windows_recovery.outputs.desktop_workflow_sha || steps.recovery.outputs.desktop_workflow_sha || github.workflow_sha }}
      desktop_workflow_ref: ${{ steps.continuation75.outputs.desktop_workflow_ref || steps.continuation.outputs.desktop_workflow_ref || steps.windows_recovery.outputs.desktop_workflow_ref || steps.recovery.outputs.desktop_workflow_ref || github.workflow_ref }}
      source_ci_run_id: ${{ steps.android_ci.outputs.run_id }}
      recovery_artifact_attempt: ${{ steps.continuation75.outputs.recovery_artifact_attempt || steps.continuation.outputs.recovery_artifact_attempt || steps.windows_recovery.outputs.recovery_artifact_attempt || steps.recovery.outputs.recovery_artifact_attempt }}
      recovery_receipt_sha256: ${{ steps.recovery.outputs.recovery_receipt_sha256 }}
      recovery75_receipt_sha256: ${{ steps.continuation75.outputs.recovery75_receipt_sha256 }}
      recovery_workflow_sha256: ${{ steps.continuation75.outputs.recovery_workflow_sha256 || steps.continuation.outputs.recovery_workflow_sha256 || steps.windows_recovery.outputs.recovery_workflow_sha256 || steps.recovery.outputs.recovery_workflow_sha256 }}
      android_source_sha: ${{ steps.restore74.outputs.android_source_sha || steps.continuation75.outputs.android_source_sha || steps.continuation.outputs.android_source_sha || steps.windows_recovery.outputs.android_source_sha || steps.recovery.outputs.android_source_sha }}
      android_lock_sha256: ${{ steps.restore74.outputs.android_lock_sha256 || steps.continuation75.outputs.android_lock_sha256 || steps.continuation.outputs.android_lock_sha256 || steps.windows_recovery.outputs.android_lock_sha256 || steps.recovery.outputs.android_lock_sha256 }}
      restored_source_ci_run_id: ${{ steps.restore74.outputs.source_ci_run_id }}
      continuation_packaging_sha256: ${{ steps.continuation.outputs.packaging_sha256 }}
      continuation_android_run_id: ${{ steps.continuation.outputs.android_run_id }}
      continuation_android_run_attempt: ${{ steps.continuation.outputs.android_run_attempt }}
      continuation_android_context_sha: ${{ steps.continuation.outputs.android_context_sha }}
      continuation_android_workflow_sha: ${{ steps.continuation.outputs.android_workflow_sha }}
      continuation_android_workflow_ref: ${{ steps.continuation.outputs.android_workflow_ref }}
      windows_packaging_sha256: ${{ steps.windows_recovery.outputs.windows_packaging_sha256 }}
      windows_recovery_receipt_sha256: ${{ steps.windows_recovery.outputs.windows_recovery_receipt_sha256 }}
      recovered_apk_sha256: ${{ steps.continuation.outputs.apk_sha256 || steps.windows_recovery.outputs.apk_sha256 }}
      recovered_apk_receipt_sha256: ${{ steps.continuation.outputs.apk_receipt_sha256 || steps.windows_recovery.outputs.apk_receipt_sha256 }}
    steps:
      - name: Require artifact-only mode for a Windows candidate
        if: inputs.windows_candidate_only && (inputs.publish || inputs.windows_only || inputs.android_only || inputs.recover_desktop_run_id != '' || inputs.recover_windows_run_id != '' || inputs.continue_release75_run_id != '')
        run: |
          echo "Windows candidates require publish=false." >&2
          exit 1
      - name: Checkout promoted source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate platform selection
        env:
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
          ANDROID_ONLY: ${{ inputs.android_only }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
          RECOVERY_RUN_ID: ${{ inputs.recover_desktop_run_id }}
          WINDOWS_RECOVERY_RUN_ID: ${{ inputs.recover_windows_run_id }}
          ANDROID_SOURCE_SHA: ${{ inputs.android_source_sha }}
          CONTINUATION_RUN_ID: ${{ inputs.continue_release68_run_id }}
          CONTINUATION75_RUN_ID: ${{ inputs.continue_release75_run_id }}
          RESTORE_ANDROID74: ${{ inputs.restore_android74 }}
        run: |
          set -euo pipefail
          if [[ "${RESTORE_ANDROID74:-false}" == true ]]; then
            test "$ANDROID_ONLY" == true
            test "$DESKTOP_ONLY" != true
            test "$WINDOWS_ONLY" != true
            test '${{ inputs.windows_candidate_only }}' != true
            test -z "$RECOVERY_RUN_ID"
            test -z "$WINDOWS_RECOVERY_RUN_ID"
            test -z "$ANDROID_SOURCE_SHA"
            test -z "$CONTINUATION_RUN_ID"
            test -z "$CONTINUATION75_RUN_ID"
          fi
          if [[ -n "${CONTINUATION75_RUN_ID:-}" ]]; then
            [[ "$CONTINUATION75_RUN_ID" == 40821076738 ]]
            test '${{ inputs.publish }}' == true
            test '${{ inputs.windows_candidate_only }}' != true
            test "$WINDOWS_ONLY" != true
            test "$ANDROID_ONLY" != true
            test "$DESKTOP_ONLY" != true
            test -z "$RECOVERY_RUN_ID"
            test -z "$WINDOWS_RECOVERY_RUN_ID"
            test -z "$ANDROID_SOURCE_SHA"
            test -z "$CONTINUATION_RUN_ID"
          fi
          if [[ -n "${CONTINUATION_RUN_ID:-}" ]]; then
            [[ "$CONTINUATION_RUN_ID" == 40291055865 || "$CONTINUATION_RUN_ID" == 40297878651 ]]
            test "$WINDOWS_ONLY" != true
            test "$ANDROID_ONLY" != true
            test "$DESKTOP_ONLY" != true
            test -z "$RECOVERY_RUN_ID"
            test -z "$WINDOWS_RECOVERY_RUN_ID"
            test -z "$ANDROID_SOURCE_SHA"
            test '${{ inputs.windows_candidate_only }}' != true
          fi
          if [[ "${WINDOWS_ONLY:-false}" == true ]]; then
            test "$ANDROID_ONLY" != true
            test "$DESKTOP_ONLY" != true
            test -z "$RECOVERY_RUN_ID"
            test -z "$WINDOWS_RECOVERY_RUN_ID"
            test -z "$ANDROID_SOURCE_SHA"
          fi
          if [[ "$ANDROID_ONLY" == true ]]; then
            test "$DESKTOP_ONLY" != true
            test -z "$RECOVERY_RUN_ID"
            test -z "$WINDOWS_RECOVERY_RUN_ID"
            test -z "$ANDROID_SOURCE_SHA"
          fi
          if [[ "$DESKTOP_ONLY" == true ]]; then
            test -z "$RECOVERY_RUN_ID"
            test -z "$WINDOWS_RECOVERY_RUN_ID"
          fi
          if [[ -n "$WINDOWS_RECOVERY_RUN_ID" ]]; then
            test -z "$RECOVERY_RUN_ID"
            test -z "$ANDROID_SOURCE_SHA"
          fi

      - id: continuation75
        name: Verify original .75 desktop bytes and source-bound route receipts
        if: inputs.continue_release75_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTINUATION75_RUN_ID: ${{ inputs.continue_release75_run_id }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_SHA"
          git show "$CONTROL_SHA:scripts/morrowbyte/release75-continuation.py" > "$RUNNER_TEMP/release75-continuation.py"
          python3 "$RUNNER_TEMP/release75-continuation.py" recover

      - name: Preserve verified original .75 platform bytes without rebuilding
        if: steps.continuation75.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-recovered75-platforms
          path: ${{ runner.temp }}/release75-verified-platforms/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - id: continuation
        name: Verify the corrected .68 bundle and signed source-matching Android package
        if: inputs.continue_release68_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTINUATION_RUN_ID: ${{ inputs.continue_release68_run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/morrowbyte/release68-continuation.py" > "$RUNNER_TEMP/release68-continuation.py"
          python3 "$RUNNER_TEMP/release68-continuation.py"

      - name: Retain verified .68 shared bundle without rebuilding
        if: steps.continuation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-js-bundle
          path: ${{ runner.temp }}/release68/js
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Retain the verified source-matching .68 Android package without rebuilding
        if: steps.continuation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-android
          path: ${{ runner.temp }}/release68/android/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Retain verified .68 linux package bytes
        if: inputs.continue_release68_run_id == '40297878651'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-linux
          path: ${{ runner.temp }}/release68/linux/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Retain verified .68 cli-linux package bytes
        if: inputs.continue_release68_run_id == '40297878651'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-cli-linux
          path: ${{ runner.temp }}/release68/cli-linux/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Retain verified .68 windows package bytes
        if: inputs.continue_release68_run_id == '40297878651'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-windows
          path: ${{ runner.temp }}/release68/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Retain verified .68 cli-windows package bytes
        if: inputs.continue_release68_run_id == '40297878651'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-cli-windows
          path: ${{ runner.temp }}/release68/cli-windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Preserve .68 continuation provenance
        if: steps.continuation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-continuation68
          path: ${{ runner.temp }}/release68/CONTINUATION68.json
          if-no-files-found: error
          retention-days: 7

      - id: recovery
        name: Recover only the pinned .48 desktop bytes and original proofs
        if: inputs.recover_desktop_run_id != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recover_desktop_run_id }}
          ANDROID_SOURCE_SHA: ${{ inputs.android_source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYRECOVERY'
          import hashlib, json, os, pathlib, re, shutil, stat, subprocess, zipfile
          source = 'ce275176a119b1a2c599c23e6acd7d537cc4c336'
          origin_run = '39093205395'
          workflow = '.github/workflows/morrowbyte-release.yml'
          workflow_ref = 'morrowbyte/t3code/' + workflow + '@refs/heads/main'
          expected_route = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          repo = os.environ['GITHUB_REPOSITORY']
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          api = lambda suffix: json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/' + suffix]))
          assert repo == 'morrowbyte/t3code'
          assert os.environ['RECOVERY_RUN_ID'] == origin_run and os.environ['SOURCE_SHA'] == source
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_WORKFLOW_REF'] == workflow_ref
          assert os.environ['GITHUB_WORKFLOW_SHA'] == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD') == source
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', 'main'], check=True)
          control = git('rev-parse', 'FETCH_HEAD')
          assert control == os.environ['GITHUB_SHA'], 'Recovery control must still be current main.'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, control], check=True)
          control_paths = git('diff', '--name-only', source, control).splitlines()
          android_source = os.environ['ANDROID_SOURCE_SHA'] or source
          android_lock_sha256 = digest(pathlib.Path('pnpm-lock.yaml'))
          android_paths = []
          if android_source == source:
              assert control_paths == [workflow], 'Recovery may change only this workflow, never product source/locks.'
          else:
              assert re.fullmatch('[0-9a-f]{40}', android_source), 'APK source must be an exact commit.'
              subprocess.run(['git', 'merge-base', '--is-ancestor', source, android_source], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', android_source, control], check=True)
              expected_files = {
                  'apps/mobile/app.config.ts': '39ff2c29ea82cba87d7a5b680da7215f0774fe2c8730a6bf947068c36785ddcb',
                  'patches/expo-widgets@58.0.18.patch': 'f9b031e1d1f4f98313930ca01eb0939d4193566d6da03d0f3da31019e0a3f5fc',
                  'pnpm-lock.yaml': '9d6aa0a8991480b891126e69a364fff7061a7f3452d3a368d0b35761b74ddb9b',
              }
              android_paths = git('diff', '--name-only', source, android_source).splitlines()
              assert set(android_paths) - {workflow} == set(expected_files), 'Unexpected APK product delta.'
              assert set(control_paths) == {workflow, *expected_files}, 'Unexpected recovery control delta.'
              assert set(git('diff', '--name-only', android_source, control).splitlines()) <= {workflow}, 'APK source must match current main product bytes.'
              for path, expected in expected_files.items():
                  actual = subprocess.check_output(['git', 'show', android_source + ':' + path])
                  assert hashlib.sha256(actual).hexdigest() == expected, 'APK fix bytes differ from reviewed patch/lock.'
              android_lock_sha256 = expected_files['pnpm-lock.yaml']
          origin_workflow = subprocess.check_output(['git', 'show', source + ':' + workflow])
          assert hashlib.sha256(origin_workflow).hexdigest() == 'e32a45bed015294f69c01fb44309468f389e2093f3c3e323cfdb314492c843ef'
          control_workflow_sha256 = hashlib.sha256(subprocess.check_output(['git', 'show', control + ':' + workflow])).hexdigest()
          run = api(f'actions/runs/{origin_run}')
          assert run['id'] == int(origin_run) and run['run_number'] == 48 and run['run_attempt'] == 1
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == repo
          assert run['head_sha'] == source and run['head_branch'] == 'main'
          assert run['event'] == 'workflow_dispatch' and run['path'] == workflow
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          expected_jobs = {'preflight': 'success', 'build_bundle': 'success', 'build_linux': 'success', 'build_nixos': 'success', 'build_windows': 'success', 'Build Morrowbyte Android APK': 'failure', 'publish': 'skipped'}
          jobs = api(f'actions/runs/{origin_run}/attempts/1/jobs?per_page=100')
          assert jobs['total_count'] == len(expected_jobs)
          assert {j['name']: j['conclusion'] for j in jobs['jobs']} == expected_jobs
          assert all(j['head_sha'] == source and j['status'] == 'completed' for j in jobs['jobs'])
          android = next(j for j in jobs['jobs'] if j['name'] == 'Build Morrowbyte Android APK')
          assert [s['name'] for s in android['steps'] if s['conclusion'] == 'failure'] == ['Bind source and verify standalone fork configuration']
          pins = {
              "12124275441": [
                  "morrowbyte-release-cli-windows",
                  "sha256:8bf29216a2b8a93b5cf4270bdd31e8e19213b95f0306d221f02e6bbb9b28840d"
              ],
              "12123931607": [
                  "morrowbyte-release-windows",
                  "sha256:9ab9b193bb513c27d24cec85aabf48bd843d3e3bd9fcdc91c10d073e3c1fd8c3"
              ],
              "12123712026": [
                  "morrowbyte-release-linux",
                  "sha256:86c2bcc648416611330e0bb1d3d625cc456fc1b512bf4d53d661a0763bbed686"
              ],
              "12123662231": [
                  "morrowbyte-release-cli-linux",
                  "sha256:abcc203b8420e3f50d17bdf0a14047b677c28fd53380df3253e83e809c41f363"
              ],
              "12123547205": [
                  "morrowbyte-observatory-preflight-ce275176a119b1a2c599c23e6acd7d537cc4c336-1",
                  "sha256:7ba5df1996ca0092df64256e05fb4484994cced72e7067d322be69f25336415d"
              ],
              "12123542753": [
                  "morrowbyte-release-nixos",
                  "sha256:1ba38e4340acc30081b803aee1664ae2ba2753fcf2c0a20c7d747fa8349bba00"
              ],
              "12123229340": [
                  "morrowbyte-observatory-build-ce275176a119b1a2c599c23e6acd7d537cc4c336-1",
                  "sha256:9dae9b78dcfc61c6895be13b95f2f5a74ee3166ebea6c69519aab375bad4b37b"
              ]
          }
          metadata = api(f'actions/runs/{origin_run}/artifacts?per_page=100')
          assert metadata['total_count'] == len(metadata['artifacts'])
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assets = root / 'recovered-desktop'
          assets.mkdir()
          archives = root / 'desktop-origin-archives'
          archives.mkdir()
          records = []
          for artifact_id, (name, expected_digest) in pins.items():
              found = [a for a in metadata['artifacts'] if str(a['id']) == artifact_id]
              assert len(found) == 1
              artifact = found[0]
              assert artifact['name'] == name and artifact['digest'] == expected_digest and not artifact['expired']
              assert artifact['workflow_run']['id'] == int(origin_run) and artifact['workflow_run']['head_sha'] == source
              assert artifact['workflow_run']['repository_id'] == artifact['workflow_run']['head_repository_id'] == run['repository']['id']
              archive_path = archives / (artifact_id + '.zip')
              with archive_path.open('wb') as output:
                  subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact_id}/zip'], stdout=output, check=True)
              assert archive_path.stat().st_size == artifact['size_in_bytes']
              assert 'sha256:' + digest(archive_path) == expected_digest, 'Origin artifact ZIP digest mismatch.'
              target = assets
              if name.startswith('morrowbyte-observatory-preflight-'):
                  target = root / 'observatory-route-generation'
              elif name.startswith('morrowbyte-observatory-build-'):
                  target = root / 'observatory-release-build'
              target.mkdir(exist_ok=True)
              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      assert member.filename == pathlib.PurePosixPath(member.filename).name and not member.is_dir()
                      assert not stat.S_ISLNK(member.external_attr >> 16)
                      destination = target / member.filename
                      if member.filename == 'builder-debug.yml':
                          assert target == assets and name in {'morrowbyte-release-linux', 'morrowbyte-release-windows'}, 'Unexpected builder diagnostics producer.'
                          destination = target / f'{name}-{member.filename}'
                      if destination.exists():
                          assert member.filename == 'builder-debug.yml', f'Unexpected duplicate artifact member: {destination.name}'
                          with archive.open(member) as incoming:
                              incoming_sha256 = hashlib.file_digest(incoming, 'sha256').hexdigest()
                          assert incoming_sha256 == digest(destination), f'Conflicting artifact member bytes: {destination.name}'
                          continue
                      with archive.open(member) as incoming, destination.open('xb') as outgoing:
                          shutil.copyfileobj(incoming, outgoing)
              records.append({key: artifact[key] for key in ['id', 'name', 'digest', 'size_in_bytes', 'expires_at']})
              archive_path.unlink()
          preflight = root / 'observatory-route-generation'
          build = root / 'observatory-release-build'
          pre = json.loads((preflight / 'receipt.json').read_bytes())
          built = json.loads((build / 'receipt.json').read_bytes())
          for receipt in [pre, built]:
              assert receipt['source'] == receipt['trustedContextSha'] == receipt['trustedWorkflowSha'] == source
              assert receipt['run'] == origin_run and receipt['attempt'] == '1'
              assert receipt['trustedWorkflowRef'] == workflow_ref
              assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
          assert pre['status'] == 'generated-unreviewed' and pre['effectiveSourceSha'] == source
          assert pre['checkScriptSha256'] == digest(pathlib.Path('scripts/morrowbyte/check.sh'))
          assert pre['beforeSha256'] == hashlib.sha256(subprocess.check_output(['git', 'show', source + ':apps/web/src/routeTree.gen.ts'])).hexdigest()
          assert pre['generatorVersion'] == '1.167.12' and pre['config'] == {'autoCodeSplitting': True}
          assert pre['afterSha256'] == built['generatedRouteSha256'] == expected_route
          assert digest(preflight / 'routeTree.gen.ts') == digest(build / 'routeTree.gen.ts') == expected_route
          assert built['preflightReceiptSha256'] == digest(preflight / 'receipt.json')
          assert (preflight / 'routeTree.diff').is_file()
          receipt = {'schemaVersion': 1, 'source': source, 'version': '0.1.2-nightly.20261018.48', 'originRun': origin_run, 'originAttempt': '1',
                     'originWorkflowSha': source, 'originWorkflowRef': workflow_ref, 'originWorkflowSha256': hashlib.sha256(origin_workflow).hexdigest(),
                     'promotionRun': os.environ['GITHUB_RUN_ID'], 'promotionAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'promotionContextSha': control, 'promotionWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
                     'promotionWorkflowRef': os.environ['GITHUB_WORKFLOW_REF'], 'promotionWorkflowSha256': control_workflow_sha256,
                     'changedPaths': control_paths, 'androidSource': android_source, 'androidLockSha256': android_lock_sha256,
                     'androidSourceChangedPaths': android_paths, 'originArtifacts': records,
                     'files': [{'name': p.name, 'sha256': digest(p)} for p in sorted(assets.iterdir())]}
          receipt_path = assets / 'DESKTOP-RECOVERY.json'
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'source_sha': source, 'version': receipt['version'], 'android_version_code': '48', 'tag': 'v' + receipt['version'],
                                 'observatory_route_sha256': expected_route, 'desktop_run_id': origin_run, 'desktop_run_attempt': '1',
                                 'desktop_context_sha': source, 'desktop_workflow_sha': source, 'desktop_workflow_ref': workflow_ref,
                                 'recovery_artifact_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                                 'recovery_receipt_sha256': digest(receipt_path), 'recovery_workflow_sha256': control_workflow_sha256,
                                 'android_source_sha': android_source, 'android_lock_sha256': android_lock_sha256}.items():
                  output.write(f'{key}={value}\n')
          PYRECOVERY

      - id: windows_recovery
        name: Recover pinned .59 platform bytes and proofs for Windows-only packaging
        if: inputs.recover_windows_run_id != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recover_windows_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYWINDOWSRECOVERY'
          import hashlib, json, os, pathlib, shutil, stat, subprocess, zipfile
          source = 'd9e730bfa6fb363206f6b10efc5334daaa69ecc8'
          origin_run = '39182028263'
          version = '0.1.2-nightly.20261019.59'
          workflow = '.github/workflows/morrowbyte-release.yml'
          workflow_ref = 'morrowbyte/t3code/' + workflow + '@refs/heads/main'
          packaging = 'scripts/build-desktop-artifact.ts'
          packaging_sha256 = '109cd7bf8c9c87b73bc1735486f3f57228e6944735e78b2239475b335f8f58c1'
          expected_route = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          repo = os.environ['GITHUB_REPOSITORY']
          digest = lambda p: hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          api = lambda suffix: json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/' + suffix]))
          assert repo == 'morrowbyte/t3code'
          assert os.environ['RECOVERY_RUN_ID'] == origin_run and os.environ['SOURCE_SHA'] == source
          assert os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_WORKFLOW_REF'] == workflow_ref
          assert os.environ['GITHUB_WORKFLOW_SHA'] == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD') == source
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', 'main'], check=True)
          control = git('rev-parse', 'FETCH_HEAD')
          assert control == os.environ['GITHUB_SHA'], 'Recovery control must still be current main.'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, control], check=True)
          changed = git('diff', '--name-only', source, control).splitlines()
          assert set(changed) == {workflow, packaging, 'scripts/build-desktop-artifact.test.ts', 'scripts/morrowbyte/nightly-after-ci.test.cjs'}, 'Only the reviewed packaging validation fix, workflow and their tests may differ.'
          assert hashlib.sha256(subprocess.check_output(['git', 'show', control + ':' + packaging])).hexdigest() == packaging_sha256
          assert hashlib.sha256(subprocess.check_output(['git', 'show', control + ':scripts/build-desktop-artifact.test.ts'])).hexdigest() == 'dab4ead08843340d79b1e8cd4f584ee87c29de1f64834a835d937714aa6699a4'
          assert hashlib.sha256(subprocess.check_output(['git', 'show', control + ':scripts/morrowbyte/nightly-after-ci.test.cjs'])).hexdigest() == '458bbeb4f0cc348e10aa7f7c2d1c9f73eab1a0e480c430a779fcb036d0494d7f'
          origin_workflow = subprocess.check_output(['git', 'show', source + ':' + workflow])
          assert hashlib.sha256(origin_workflow).hexdigest() == '20bb97bc06ce14695be27f62bf42e27d371efbf68e48f7bcb4090cb3a648d984'
          control_workflow_sha256 = hashlib.sha256(subprocess.check_output(['git', 'show', control + ':' + workflow])).hexdigest()
          run = api(f'actions/runs/{origin_run}')
          assert run['id'] == int(origin_run) and run['run_number'] == 59 and run['run_attempt'] == 1
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == repo
          assert run['head_sha'] == source and run['head_branch'] == 'main' and run['event'] == 'workflow_dispatch' and run['path'] == workflow
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          jobs = api(f'actions/runs/{origin_run}/attempts/1/jobs?per_page=100')
          expected_jobs = {'preflight': 'success', 'build_bundle': 'success', 'build_linux': 'success', 'build_nixos': 'success', 'build_windows': 'failure', 'Build Morrowbyte Android APK': 'success', 'publish': 'skipped'}
          assert jobs['total_count'] == len(expected_jobs) and {j['name']: j['conclusion'] for j in jobs['jobs']} == expected_jobs
          assert all(j['head_sha'] == source and j['status'] == 'completed' for j in jobs['jobs'])
          windows = next(j for j in jobs['jobs'] if j['name'] == 'build_windows')
          assert [s['name'] for s in windows['steps'] if s['conclusion'] == 'failure'] == ['Build Windows x64 installer and updater metadata']
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assets = root / 'recovered-platforms'
          cli = root / 'recovered-cli-linux'
          bundle = root / 'recovered-js-bundle'
          preflight = root / 'observatory-route-generation'
          build = root / 'observatory-release-build'
          pins = {
              '12157300057': ('morrowbyte-release-nixos', 'sha256:340b957b849a3d2da228960da045adda3d1f6913fd5772557b6e0801d158e9dc', assets),
              '12157055292': ('morrowbyte-release-linux', 'sha256:6ecaa760574e1b17b49ad3512252121ad1d3eae725e4d133809605e51185b9cf', assets),
              '12156761220': ('morrowbyte-js-bundle', 'sha256:5c1c01c490e5227ed1ec74180982ec2b577bc3f3facc9c67e7cad95107470f79', bundle),
              '12156662269': ('morrowbyte-observatory-preflight-' + source + '-1', 'sha256:309e39d4b4726f3644504f08e476c06129d08e7a93ee99ba99dab56b1f107279', preflight),
              '12156487329': ('morrowbyte-release-android', 'sha256:5c02e178c95a89f12c17b18bc11b0717687cf4010b1234dc70ef0e1710dd3431', assets),
              '12156279210': ('morrowbyte-release-cli-linux', 'sha256:b9039b2dc21202aa822c79dea7fb4e4d73a32029a175af1703c98d41125c34f9', cli),
              '12156199343': ('morrowbyte-observatory-build-' + source + '-1', 'sha256:30ff385545f9e749d4c904274193158f6dcfb3617be141e61c5d39138cd7cf4c', build),
          }
          metadata = api(f'actions/runs/{origin_run}/artifacts?per_page=100')
          assert metadata['total_count'] == len(metadata['artifacts'])
          records = []
          for artifact_id, (name, expected_digest, target) in pins.items():
              found = [a for a in metadata['artifacts'] if str(a['id']) == artifact_id]
              assert len(found) == 1
              artifact = found[0]
              assert artifact['name'] == name and artifact['digest'] == expected_digest and not artifact['expired']
              assert artifact['workflow_run']['id'] == int(origin_run) and artifact['workflow_run']['head_sha'] == source
              assert artifact['workflow_run']['repository_id'] == artifact['workflow_run']['head_repository_id'] == run['repository']['id']
              archive_path = root / (artifact_id + '.zip')
              with archive_path.open('wb') as output:
                  subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact_id}/zip'], stdout=output, check=True)
              assert archive_path.stat().st_size == artifact['size_in_bytes'] and 'sha256:' + digest(archive_path) == expected_digest, 'Origin artifact ZIP digest mismatch.'
              target.mkdir(exist_ok=True)
              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      relative = pathlib.PurePosixPath(member.filename)
                      assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in member.filename
                      assert not stat.S_ISLNK(member.external_attr >> 16)
                      if target == bundle:
                          assert relative.parts[:2] in {('server', 'dist'), ('desktop', 'dist-electron')}, 'Unexpected shared bundle path.'
                      else:
                          assert member.filename == relative.name and not member.is_dir()
                      destination = target / member.filename
                      if member.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                          continue
                      if member.filename == 'builder-debug.yml':
                          assert target == assets and name == 'morrowbyte-release-linux'
                          destination = target / (name + '-' + member.filename)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(member) as incoming, destination.open('xb') as outgoing:
                          shutil.copyfileobj(incoming, outgoing)
              records.append({key: artifact[key] for key in ['id', 'name', 'digest', 'size_in_bytes', 'expires_at']})
              archive_path.unlink()
          pre = json.loads((preflight / 'receipt.json').read_bytes())
          built = json.loads((build / 'receipt.json').read_bytes())
          lock_sha256 = digest(pathlib.Path('pnpm-lock.yaml'))
          for proof in [pre, built]:
              assert proof['source'] == proof['trustedContextSha'] == proof['trustedWorkflowSha'] == source
              assert proof['run'] == origin_run and proof['attempt'] == '1' and proof['trustedWorkflowRef'] == workflow_ref
              assert proof['lockSha256'] == lock_sha256
          assert pre['status'] == 'generated-unreviewed' and pre['effectiveSourceSha'] == source
          assert pre['checkScriptSha256'] == digest(pathlib.Path('scripts/morrowbyte/check.sh'))
          assert pre['beforeSha256'] == hashlib.sha256(subprocess.check_output(['git', 'show', source + ':apps/web/src/routeTree.gen.ts'])).hexdigest()
          assert pre['generatorVersion'] == '1.167.12' and pre['config'] == {'autoCodeSplitting': True}
          assert pre['afterSha256'] == built['generatedRouteSha256'] == expected_route
          assert digest(preflight / 'routeTree.gen.ts') == digest(build / 'routeTree.gen.ts') == expected_route
          assert built['preflightReceiptSha256'] == digest(preflight / 'receipt.json') and (preflight / 'routeTree.diff').is_file()
          apk = assets / f'Morrowbyte-{version}-android-arm64.apk'
          apk_receipt = apk.with_name(apk.name + '.json')
          receipt = json.loads(apk_receipt.read_bytes())
          assert receipt['source'] == receipt['desktopSource'] == receipt['trustedContextSha'] == receipt['trustedWorkflowSha'] == source
          assert receipt['run'] == origin_run and receipt['attempt'] == '1' and receipt['trustedWorkflowRef'] == workflow_ref
          assert receipt['version'] == version and receipt['versionCode'] == 59 and receipt['lockSha256'] == lock_sha256
          assert receipt['apk'] == apk.name and receipt['apkSha256'] == digest(apk)
          recovery = {'schemaVersion': 1, 'source': source, 'version': version, 'originRun': origin_run, 'originAttempt': '1',
                      'originWorkflowSha': source, 'originWorkflowRef': workflow_ref, 'originWorkflowSha256': hashlib.sha256(origin_workflow).hexdigest(),
                      'publicationRun': os.environ['GITHUB_RUN_ID'], 'publicationAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'controlSource': control, 'controlWorkflowSha256': control_workflow_sha256, 'changedPaths': changed,
                      'windowsPackagingScript': packaging, 'windowsPackagingScriptSha256': packaging_sha256,
                      'originArtifacts': records,
                      'files': [{'name': p.name, 'sha256': digest(p)} for directory in [assets, cli] for p in sorted(directory.iterdir())]}
          recovery_path = assets / 'WINDOWS-RECOVERY.json'
          recovery_path.write_text(json.dumps(recovery, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'source_sha': source, 'version': version, 'android_version_code': '59', 'tag': 'v' + version,
                                 'observatory_route_sha256': expected_route, 'desktop_run_id': origin_run, 'desktop_run_attempt': '1',
                                 'desktop_context_sha': source, 'desktop_workflow_sha': source, 'desktop_workflow_ref': workflow_ref,
                                 'recovery_artifact_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'recovery_workflow_sha256': control_workflow_sha256,
                                 'windows_packaging_sha256': packaging_sha256, 'windows_recovery_receipt_sha256': digest(recovery_path),
                                 'android_source_sha': source, 'android_lock_sha256': lock_sha256,
                                 'apk_sha256': digest(apk), 'apk_receipt_sha256': digest(apk_receipt)}.items():
                  output.write(f'{key}={value}\n')
          PYWINDOWSRECOVERY

      - name: Preserve recovered .59 platform bytes without rebuilding
        if: inputs.recover_windows_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-recovered-platforms
          path: ${{ runner.temp }}/recovered-platforms/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve original .59 Linux CLI and WSL runtime
        if: inputs.recover_windows_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-cli-linux
          path: ${{ runner.temp }}/recovered-cli-linux/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve original .59 shared bundle for Windows packaging
        if: inputs.recover_windows_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-js-bundle
          path: ${{ runner.temp }}/recovered-js-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve recovered desktop bytes without rebuilding
        if: inputs.recover_desktop_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-recovered-desktop
          path: ${{ runner.temp }}/recovered-desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve original Observatory build proof without rewriting it
        if: inputs.recover_desktop_run_id != '' || inputs.recover_windows_run_id != '' || steps.continuation.outcome == 'success' || steps.continuation75.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-observatory-build-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-release-build/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify published or artifact-only source
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ANDROID_SOURCE_SHA: ${{ inputs.android_source_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          DISPATCHED_REF: ${{ github.ref }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          test -z "$ANDROID_SOURCE_SHA"
          bash scripts/morrowbyte/verify-desktop-source.sh "$SOURCE_SHA" "$PUBLISH_RELEASE" "$DISPATCHED_REF" "$DISPATCHED_SHA"

      - id: restore74
        name: Verify the fixed published .74 Android restore baseline
        if: inputs.restore_android74
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          gh api repos/morrowbyte/t3code/releases/tags/v0.1.4-nightly.20261027.74 > "$RUNNER_TEMP/android-restore74-release.json"
          gh api repos/morrowbyte/t3code/actions/runs/40582582053 > "$RUNNER_TEMP/android-restore74-ci.json"
          python3 - <<'PYRESTORE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          source = '135802e2d15a46d796c7fa736e6da4c82c5b1d20'
          lock = 'db45b4aacebe846fca988d07543edcf1751fdd17aeeb22d8a23d77c83662f66f'
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'android-restore74-release.json').read_text())
          ci = json.loads((Path(os.environ['RUNNER_TEMP']) / 'android-restore74-ci.json').read_text())
          assert os.environ['GITHUB_REPOSITORY'] == 'morrowbyte/t3code'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CONTROL_SOURCE_SHA'] == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, os.environ['CONTROL_SOURCE_SHA']], check=True)
          assert release['tag_name'] == 'v0.1.4-nightly.20261027.74' and release['target_commitish'] == source
          assert release['draft'] is False and release['prerelease'] is True and release['published_at']
          name = 'Morrowbyte-0.1.4-nightly.20261027.74-android-arm64.apk'
          assets = {asset['name']: asset for asset in release['assets']}
          expected = {name: 'ca8c6150e750f53f23b0cc88cdf22506325373a280777daa718b38a7da15e6d2',
                      name + '.json': '1ac7b937eadf7f452b664a8aeb75c79c4b41d2a9f3c74669affa5a7270cb5b65',
                      name + '.sha256': '7b409958c973223ef7e9d161f8a64872d847e3eca09c49a4a04f76ae4ee59169'}
          assert set(expected) <= set(assets)
          assert all(assets[key]['digest'] == 'sha256:' + digest for key, digest in expected.items())
          assert ci['id'] == 40582582053 and ci['head_sha'] == source
          assert ci['head_branch'] == 'main' and ci['event'] == 'push' and ci['path'] == '.github/workflows/morrowbyte-ci.yml'
          assert ci['repository']['full_name'] == ci['head_repository']['full_name'] == 'morrowbyte/t3code'
          assert ci['status'] == 'completed' and ci['conclusion'] == 'success'
          assert hashlib.sha256(subprocess.check_output(['git', 'show', source + ':pnpm-lock.yaml'])).hexdigest() == lock
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'android_source_sha={source}\nandroid_lock_sha256={lock}\nsource_ci_run_id=40582582053\n')
          PYRESTORE

      - name: Setup Vite+
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id
        run: |
          if [[ '${{ inputs.android_only }}' == true && '${{ inputs.publish }}' == true ]]; then
            vp install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...
          else
            vp install --frozen-lockfile
          fi
      - name: Prepare pinned Electron runtime before desktop imports
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs

      - name: Install pinned Chromium for focused renderer gates
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id && (inputs.android_only != true || inputs.publish != true)
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Check source before release
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id && (inputs.android_only != true || inputs.publish != true)
        env:
          EFFECTIVE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EFFECTIVE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EFFECTIVE_SOURCE_SHA"
          bash scripts/morrowbyte/check.sh

      - id: android_ci
        name: Reuse exact main source CI before Android-only release
        if: inputs.android_only && inputs.publish
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/morrowbyte-ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > "$RUNNER_TEMP/android-source-ci.json"
          python3 - <<'PYCI'
          import json, os, pathlib
          runs = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-source-ci.json').read_bytes())['workflow_runs']
          matching = [run for run in runs if run['head_sha'] == os.environ['SOURCE_SHA']
                      and run['head_branch'] == 'main' and run['event'] == 'push'
                      and run['path'] == '.github/workflows/morrowbyte-ci.yml'
                      and run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']]
          assert matching, 'Exact main source CI is required before Android-only compilation.'
          latest = max(matching, key=lambda run: run['id'])
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'Latest exact main CI did not pass.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run_id={latest['id']}\n")
          PYCI

      - id: route
        name: Verify reviewed Observatory preflight route
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id && (inputs.android_only != true || inputs.publish != true)
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observatory-route-generation'
          receipt = json.loads((root / 'receipt.json').read_bytes())
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = receipt['afterSha256']
          assert isinstance(expected, str) and len(expected) == 64 and all(c in '0123456789abcdef' for c in expected)
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert receipt['status'] == 'generated-unreviewed'
          assert receipt['source'] == receipt['effectiveSourceSha'] == source
          assert receipt['run'] == os.environ['GITHUB_RUN_ID'] and receipt['attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert receipt['trustedContextSha'] == os.environ['GITHUB_SHA']
          assert receipt['trustedWorkflowSha'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert receipt['trustedWorkflowRef'] == os.environ['GITHUB_WORKFLOW_REF']
          assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
          assert receipt['checkScriptSha256'] == digest(pathlib.Path('scripts/morrowbyte/check.sh'))
          before = subprocess.check_output(['git', 'show', source + ':apps/web/src/routeTree.gen.ts'])
          assert receipt['beforeSha256'] == hashlib.sha256(before).hexdigest()
          assert receipt['generatorVersion'] and receipt['config'] == {'autoCodeSplitting': True}
          assert receipt['afterSha256'] == digest(root / 'routeTree.gen.ts') == expected
          assert digest(pathlib.Path('apps/web/src/routeTree.gen.ts')) == expected
          assert (root / 'routeTree.diff').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('observatory_route_sha256=' + expected + '\n')
          PYROUTE

      - name: Preserve release Observatory preflight route evidence
        if: always() && hashFiles('apps/web/src/routes/observatory.tsx') != '' && ((inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id) || steps.recovery.outcome == 'success' || steps.windows_recovery.outcome == 'success' || steps.continuation.outcome == 'success' || steps.continuation75.outcome == 'success') && (inputs.android_only != true || inputs.publish != true)
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-observatory-preflight-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observatory-route-generation/receipt.json
            ${{ runner.temp }}/observatory-route-generation/routeTree.gen.ts
            ${{ runner.temp }}/observatory-route-generation/routeTree.diff
          if-no-files-found: error
          retention-days: 7

      - id: release
        name: Resolve distinct fork version
        if: inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN: ${{ github.run_number }}
          RELEASE_SEQUENCE_OFFSET: ${{ vars.MORROWBYTE_RELEASE_SEQUENCE_OFFSET || '0' }}
          ANDROID_ONLY: ${{ inputs.android_only }}
          RESTORE_ANDROID74: ${{ inputs.restore_android74 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_SEQUENCE_OFFSET" =~ ^[0-9]+$ ]]
          RELEASE_RUN=$(( RELEASE_RUN + 10#$RELEASE_SEQUENCE_OFFSET ))
          (( RELEASE_RUN <= 2100000000 ))
          upstream_metadata="$RUNNER_TEMP/upstream-nightly.txt"
          run_created_at="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          release_date="$(bash scripts/morrowbyte/resolve-run-date.sh "$run_created_at")"
          if [[ "${RESTORE_ANDROID74:-false}" == true ]]; then
            test "$release_date" == 20261029
            (( RELEASE_RUN > 75 ))
          fi
          node scripts/resolve-nightly-release.ts \
            --date "$release_date" \
            --run-number "$RELEASE_RUN" \
            --sha "$SOURCE_SHA" > "$upstream_metadata"
          source_nightly_base="$(sed -n 's/^base_version=//p' "$upstream_metadata")"
          fork_version="$(bash scripts/morrowbyte/resolve-version.sh \
            "$source_nightly_base" \
            "$release_date" \
            "$RELEASE_RUN" | sed -n 's/^version=//p')"
          if [[ -z "$fork_version" ]]; then
            echo "Could not resolve a fork release version." >&2
            exit 1
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "version=$fork_version"
            echo "android_version_code=$RELEASE_RUN"
            if [[ "$ANDROID_ONLY" == true ]]; then
              echo "tag=android/v$fork_version"
            else
              echo "tag=v$fork_version"
            fi
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    if: inputs.android_only != true && inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' && inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id
    needs: [preflight]
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions and build shared assets
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          vp run build:desktop

      - name: Download reviewed preflight route evidence
        if: needs.preflight.outputs.observatory_route_sha256 != ''
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-observatory-preflight-${{ needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observatory-release-preflight

      - name: Bind independently built Observatory route
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PREFLIGHT_ROUTE_SHA: ${{ needs.preflight.outputs.observatory_route_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            test -z "$PREFLIGHT_ROUTE_SHA"
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = os.environ['PREFLIGHT_ROUTE_SHA']
          assert len(expected) == 64 and all(c in '0123456789abcdef' for c in expected)
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert os.environ['PREFLIGHT_ROUTE_SHA'] == expected
          preflight = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observatory-release-preflight'
          before = json.loads((preflight / 'receipt.json').read_bytes())
          assert before['source'] == before['effectiveSourceSha'] == source
          assert before['run'] == os.environ['GITHUB_RUN_ID'] and before['attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert before['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
          assert before['afterSha256'] == digest(preflight / 'routeTree.gen.ts') == expected
          actual = pathlib.Path('apps/web/src/routeTree.gen.ts')
          assert digest(actual) == expected
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observatory-release-build'
          output.mkdir(mode=0o700)
          (output / 'routeTree.gen.ts').write_bytes(actual.read_bytes())
          receipt = {'source': source, 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'lockSha256': before['lockSha256'], 'generatedRouteSha256': expected,
                     'preflightReceiptSha256': digest(preflight / 'receipt.json'),
                     'trustedContextSha': os.environ['GITHUB_SHA'], 'trustedWorkflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
                     'trustedWorkflowRef': os.environ['GITHUB_WORKFLOW_REF']}
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYROUTE

      - name: Preserve independently built Observatory route evidence
        if: always() && hashFiles('apps/web/src/routes/observatory.tsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-observatory-build-${{ needs.preflight.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observatory-release-build/receipt.json
            ${{ runner.temp }}/observatory-release-build/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 7

      - name: Upload shared assets
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  build_linux:
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' && !inputs.windows_only && !inputs.android_only &&
          inputs.recover_desktop_run_id == '' && inputs.recover_windows_run_id == '' &&
          ((inputs.continue_release68_run_id == '' && !inputs.continue_release75_run_id && needs.build_bundle.result == 'success') ||
           (inputs.continue_release68_run_id == '40291055865' && needs.build_bundle.result == 'skipped')) }}
    needs: [preflight, build_bundle]
    runs-on: ${{ inputs.runner_backend == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Apply the reviewed .68 release-stage copy fix
        if: inputs.continue_release68_run_id != ''
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          PACKAGING_SHA256: ${{ needs.preflight.outputs.continuation_packaging_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = be6292cd24dfe799ce9fcabed5a125c324ae5d06
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin "$CONTROL_SHA"
          git show "$CONTROL_SHA:scripts/build-desktop-artifact.ts" > scripts/build-desktop-artifact.ts
          printf '%s  %s\n' "$PACKAGING_SHA256" scripts/build-desktop-artifact.ts | sha256sum --check --strict
          test "$(git diff --name-only)" = scripts/build-desktop-artifact.ts

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Download shared assets
        uses: actions/download-artifact@v4
        with:
          name: morrowbyte-js-bundle
          path: apps

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build Linux CLI executable
        env:
          VP_NODE_VERSION: "26.12.1"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build Linux AppImage and updater metadata
        if: inputs.windows_candidate_only != true
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code' }}
          T3CODE_DESKTOP_APP_ID: ${{ vars.MORROWBYTE_DESKTOP_APP_ID || 'com.morrowbyte.t3code' }}
          T3CODE_DESKTOP_INSTALLER_GUID: ${{ vars.MORROWBYTE_DESKTOP_INSTALLER_GUID }}
          T3CODE_DESKTOP_PRODUCT_NAME: ${{ vars.MORROWBYTE_DESKTOP_PRODUCT_NAME || 'Crew' }}
          T3CODE_DESKTOP_PROFILE: morrowbyte
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "false"
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: "false"
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 --build-version "${{ needs.preflight.outputs.version }}" --skip-build --keep-stage --output-dir release-linux
          test -s release-linux/nightly-linux.yml
          shopt -s nullglob
          stage_roots=(/tmp/t3code-desktop-linux-stage-* "$RUNNER_TEMP"/t3code-desktop-linux-stage-*)
          test "${#stage_roots[@]}" -gt 0
          update_config="$(find "${stage_roots[@]}" -path '*/resources/app-update.yml' -print -quit)"
          test -n "$update_config"
          IFS=/ read -r expected_owner expected_repo <<<"${T3CODE_DESKTOP_UPDATE_REPOSITORY}"
          grep -Fq "owner: $expected_owner" "$update_config"
          grep -Fq "repo: $expected_repo" "$update_config"

      - name: Prepare NixOS download bundle
        if: inputs.windows_candidate_only != true
        run: |
          set -euo pipefail
          sed "s|morrowbyte/t3code|${{ vars.MORROWBYTE_RELEASE_REPOSITORY || 'morrowbyte/t3code' }}|g" \
            scripts/morrowbyte/install-linux.sh > release-linux/install-linux.sh
          appimage="$(find release-linux -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test "$(basename "$appimage")" = "T3-Code-${{ needs.preflight.outputs.version }}-x86_64.AppImage"
          tar -czf release-linux/morrowbyte-linux-x64.tar.gz -C release-linux \
            "$(basename "$appimage")" nightly-linux.yml install-linux.sh

      - name: Build the WSL resource monitor for a Windows candidate
        if: inputs.windows_candidate_only
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Package and smoke-test Linux CLI archive
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "${{ needs.preflight.outputs.version }}" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload Linux release assets
        if: inputs.windows_candidate_only != true
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-linux
          path: release-linux/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-release-cli-linux
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

      - name: Preserve built Linux files after a later failure
        if: ${{ failure() && hashFiles('release-linux/*.AppImage') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: morrowbyte-linux-built-diagnostic
          path: release-linux/*
          if-no-files-found: error
          retention-days: 1

  build_nixos:
    if: >-
