name: Morrowbyte main Nightly
on:
  workflow_run:
    workflows: [Morrowbyte CI]
    types: [completed]
    branches: [main]

# One writer for the durable per-source dispatch intent. Never cancel an owner
# between intent persistence and reconciliation of its dispatch acknowledgement.
concurrency:
  group: morrowbyte-main-nightly-dispatch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  dispatch:
    if: >-
      github.repository == 'morrowbyte/t3code' &&
      vars.MORROWBYTE_AUTOMATIC_NIGHTLY == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.MORROWBYTE_CI_BACKEND == 'boat' && (vars.MORROWBYTE_BOAT_RUNNER || 'boat-large') || fromJSON(format('["self-hosted","{0}"]', vars.MORROWBYTE_LINUX_RUNNER || 'morrowbyte-linux')) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/morrowbyte/nightly-after-ci.cjs
            scripts/morrowbyte/nightly-dispatch-client.cjs
            scripts/morrowbyte/source-proof.cjs
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          version: 1.4.0
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Dispatch or reconcile the existing Nightly workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BACKEND: ${{ vars.MORROWBYTE_RELEASE_BACKEND }}
        run: node scripts/morrowbyte/nightly-dispatch-client.cjs
