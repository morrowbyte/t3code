name: Morrowbyte local source check

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: morrowbyte-local-source-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'morrowbyte/t3code' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, morrowbyte-local-source-check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Prepare pinned Electron runtime
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - name: Install pinned Chromium
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Run existing focused source gates
        env:
          EFFECTIVE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EFFECTIVE_SOURCE_SHA"
          bash scripts/morrowbyte/check.sh
