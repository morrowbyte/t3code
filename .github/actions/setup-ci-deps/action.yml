name: Setup CI dependencies
description: Install pinned Vite+ and workspace dependencies with the built-in dependency cache.
inputs:
  task-cache-read-token:
    description: Read-only credential for the private maintainer task cache
    required: false
    default: ""
  install:
    description: Set to "false" to set up Vite+ only, with no pnpm store or install
    required: false
    default: "true"
  install-args:
    description: Arguments for `vp install`, such as filters. Empty installs the whole workspace.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve pinned toolchain and dependency cache identity
      id: toolchain
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        set -euo pipefail
        version="$(sed -nE 's/^  vite-plus: ([0-9][^ ]*)$/\1/p' pnpm-workspace.yaml)"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
        if [[ "$INSTALL" == true ]]; then
          cache_key="$GITHUB_WORKSPACE/node_modules/.cache/setup-ci/pnpm-lock.yaml"
          mkdir -p "$(dirname "$cache_key")"
          {
            cat pnpm-lock.yaml
            printf '\n# install-args: %s\n' "$INSTALL_ARGS"
            sha256sum package.json pnpm-workspace.yaml | sed 's/^/# /'
          } > "$cache_key"
          printf 'cache-key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup pinned Vite+ and restore dependencies
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
      env:
        VP_DOWNLOAD_TIMEOUT: "120"
      with:
        version: ${{ steps.toolchain.outputs.version }}
        node-version-file: package.json
        cache: ${{ inputs.install == 'true' }}
        cache-dependency-path: ${{ steps.toolchain.outputs.cache-key }}
        run-install: false

    - name: Configure lockfile verification cache
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        store="$(vp pm cache dir)"
        printf 'pnpm_config_cache_dir=%s\n' "${pnpm_config_cache_dir:-$store/ci-metadata}" >> "$GITHUB_ENV"

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # Unquoted so each filter is its own argument.
      run: vp install $INSTALL_ARGS

    - name: Enable shared task cache
      if: >-
        github.repository == 'pingdotgg/t3code' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        hashFiles('.task-cache.json') != '' &&
        inputs.task-cache-read-token != ''
      shell: bash
      env:
        T3_TASK_CACHE_READ_TOKEN: ${{ inputs.task-cache-read-token }}
      run: |
        node infra/task-cache/scripts/install-ci.ts
        if [[ ( "$GITHUB_EVENT_NAME" == pull_request && "$GITHUB_BASE_REF" == main ) || ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
          echo 'VP_REMOTE_CACHE=read-write' >> "$GITHUB_ENV"
        else
          echo 'VP_REMOTE_CACHE=read' >> "$GITHUB_ENV"
        fi
